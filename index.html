  return `<span class="delta ${cls}">${cls === 'up' ? ic('up', 'sm') : cls === 'down' ? ic('down', 'sm') : ''}${Math.abs(Math.round(r * 100))}%</span><span>${label || ''}</span>`;
}

/* ---------- Gráficos SVG ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
const kfmt = n => n >= 1e6 ? '$' + fmtN(n / 1e6, 1) + 'M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + 'k' : '$' + Math.round(n);
function barChart(data, opt) {
  opt = opt || {};
  const W = opt.w || 900, H = opt.h || 250, pl = 46, pr = 6, pt = 18, pb = 30;
  const max = niceMax(Math.max(1, ...data.map(d => d.v)));
  const iw = W - pl - pr, ih = H - pt - pb, bw = iw / data.length, w = Math.max(4, Math.min(44, bw * .62));
  const step = data.length > 20 ? Math.ceil(data.length / 10) : 1;
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = pt + ih - ih * i / 4; g += `<line class="grid-l" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${kfmt(max * i / 4)}</text>`; }
  data.forEach((d, i) => {
    const h = Math.max(d.v > 0 ? 2 : 0, ih * d.v / max), x = pl + bw * i + (bw - w) / 2, y = pt + ih - h;
    g += `<rect class="bar ${d.cls || ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(6, w / 3)}" data-tip="${esc(d.tip || d.label + ' · ' + money(d.v))}" ${opt.act ? `data-act="${opt.act}" data-arg="${esc(d.arg || '')}"` : ''}/>`;
    if (i % step === 0) g += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 10}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Gráfico de barras')}">${g}</svg>`;
}
function hbars(list, fmt) {
  const max = Math.max(1, ...list.map(x => x.v));
  return `<div class="hbars">${list.map(x => `<div class="hbar"><span class="lbl">${x.icon || ''}<span style="min-width:0">${esc(x.label)}</span></span><span class="val">${fmt ? fmt(x.v) : money(x.v)}${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</span><span class="track"><i style="width:${(x.v / max * 100).toFixed(1)}%;${x.color ? 'background:' + x.color : ''}"></i></span></div>`).join('')}</div>`;
}
const PALETTE = ['var(--primary)', 'var(--terra)', 'var(--sage-2)', '#C9A74A', 'var(--info)'];
function stackBar(list) {

  <div class="legend">${list.map((x, i) => `<span><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(x.label)} <b class="num">${pctTxt(x.v / tot)}</b></span>`).join('')}</div>`;

  const D = TODAY(), f = U.ped;
  if (f.q) {
    const q = f.q.toLowerCase().replace('#', '');
    const c = clientById(o.clientId);
    if (!c.name.toLowerCase().includes(q) && !String(o.number).includes(q)) return false;
  }
  if (o.status === 'entregado') return o.deliveredDate === D;
  if (f.date === 'hoy') return o.deliveryDate <= D;
  if (f.date === 'manana') return o.deliveryDate === addDays(D, 1);
  if (f.date === 'semana') return o.deliveryDate <= addDays(D, 7);
  return true;
}

/* ---------- VENTAS ---------- */
function periodRange(p) {
  const D = TODAY();
  if (p === 'hoy') return { a: D, b: D, pa: addDays(D, -7), pb: addDays(D, -7), label: 'Hoy', cmp: 'vs. el ' + DIAS[weekday(D)] + ' pasado' };
  if (p === 'semana') { const back = (weekday(D) + 6) % 7; const a = addDays(D, -back); return { a, b: D, pa: addDays(a, -7), pb: addDays(D, -7), label: 'Esta semana', cmp: 'vs. mismos días de la semana pasada' }; }
  if (p === '30d') return { a: addDays(D, -29), b: D, pa: addDays(D, -59), pb: addDays(D, -30), label: 'Últimos 30 días', cmp: 'vs. los 30 días anteriores' };
  if (p === 'mes') { const a = D.slice(0, 8) + '01'; const pd = new Date(toT(a) - DAY); const pa = fromT(Date.UTC(pd.getUTCFullYear(), pd.getUTCMonth(), 1)); const pbN = Math.min(+D.slice(8), pd.getUTCDate()); return { a, b: D, pa, pb: pa.slice(0, 8) + pad(pbN), label: cap(MESES_L[+D.slice(5, 7) - 1]), cmp: 'vs. mismo tramo del mes pasado' }; }
  if (p === 'rango' && U.ven.from && U.ven.to && U.ven.from <= U.ven.to) { const n = diffDays(U.ven.to, U.ven.from) + 1; return { a: U.ven.from, b: U.ven.to, pa: addDays(U.ven.from, -n), pb: addDays(U.ven.from, -1), label: fmtDate(U.ven.from) + ' al ' + fmtDate(U.ven.to), cmp: 'vs. los ' + n + ' días anteriores' }; }
  const first = S.orders.reduce((m, o) => o.createdAt < m ? o.createdAt : m, D);
  return { a: first, b: D, pa: null, pb: null, label: 'Todo el historial', cmp: '' };
}
function salesIn(a, b, basis) {
  const valid = S.orders.filter(o => !o.cancelled);
  if (basis === 'cobro') {
    const ps = S.payments.filter(p => p.orderId && p.date >= a && p.date <= b);
    return ps.map(p => { const o = orderById(p.orderId); const f = o.total ? p.amount / o.total : 0; return { o, date: p.date, total: p.amount, profit: profitOf(o) * f, f }; });
  }
  if (basis === 'entrega') return valid.filter(o => o.status === 'entregado' && o.deliveredDate >= a && o.deliveredDate <= b).map(o => ({ o, date: o.deliveredDate, total: o.total, profit: profitOf(o), f: 1 }));
  return valid.filter(o => o.createdAt >= a && o.createdAt <= b).map(o => ({ o, date: o.createdAt, total: o.total, profit: profitOf(o), f: 1 }));
}
function vVentas() {

  const m = rows => { const t = sum(rows, r => r.total), p = sum(rows, r => r.profit), n = new Set(rows.map(r => r.o.id)).size; return { t, p, n, avg: n ? t / n : 0, mg: t ? p / t : 0 }; };
  const c = m(cur), pv = prev ? m(prev) : null;
  const dl = (a, b) => pv ? delta(a, b, R.cmp) : '';
  /* evolución */
  const span = diffDays(R.b, R.a) + 1;
  const series = [];
  if (span <= 1) { for (let i = 13; i >= 0; i--) { const d = addDays(R.b, -i); const v = sum(salesIn(d, d, basis), r => r.total); series.push({ label: DIAS_C[weekday(d)] + ' ' + new Date(toT(d)).getUTCDate(), v, cls: i === 0 ? 'today' : '', tip: fmtLong(d) + ' · ' + money(v) }); } }
  else if (span <= 45) { for (let d = R.a; d <= R.b; d = addDays(d, 1)) { const v = sum(cur.filter(r => r.date === d), r => r.total); series.push({ label: span > 10 ? String(new Date(toT(d)).getUTCDate()) : DIAS_C[weekday(d)] + ' ' + new Date(toT(d)).getUTCDate(), v, cls: d === TODAY() ? 'today' : weekday(d) === 5 ? 'hi' : '', tip: fmtLong(d) + ' · ' + money(v) + ' · ' + cur.filter(r => r.date === d).length + ' ventas' }); } }
  else { for (let d = R.a; d <= R.b; d = addDays(d, 7)) { const e = addDays(d, 6) > R.b ? R.b : addDays(d, 6); const v = sum(cur.filter(r => r.date >= d && r.date <= e), r => r.total); series.push({ label: fmtDate(d), v, tip: 'Semana del ' + fmtDate(d) + ' · ' + money(v) }); } }
  /* desgloses */

  const prod = by(it => it.skuId), fl = by(it => skuById(it.skuId).flavor), sz = by(it => skuById(it.skuId).size);

  const flList = Object.keys(fl).map(k => ({ label: FLAVORS[k].name, v: fl[k].v })).sort((a, b) => b.v - a.v);
  const szList = Object.keys(sz).map(k => ({ label: sizeLabel(+k), v: sz[k].v, sub: Math.round(sz[k].u) + ' u' })).sort((a, b) => b.v - a.v);
  const chList = Object.keys(CHANNELS).filter(k => ch[k]).map(k => ({ label: CHANNELS[k], v: ch[k] })).sort((a, b) => b.v - a.v);
  const listRows = cur.slice().sort((a, b) => b.date.localeCompare(a.date) || b.o.number - a.o.number);
  const shown = U.ven.all ? listRows : listRows.slice(0, 15);
  return `<div class="wrap">
  ${pageHead('Ventas', 'Lo que vendiste por día, semana y mes. Elegí si contar por fecha de pedido, de entrega o de cobro.', `<button class="btn primary" data-act="new-order">${ic('plus')}Nuevo pedido</button>`)}
  <div class="toolbar">${seg('ven-p', U.ven.period, [['hoy', 'Hoy'], ['semana', 'Semana'], ['30d', '30 días'], ['mes', 'Mes'], ['todo', 'Todo'], ['rango', 'Rango']])}
    ${seg('ven-b', basis, [['pedido', 'Fecha de pedido'], ['entrega', 'Fecha de entrega'], ['cobro', 'Fecha de cobro']])}</div>
  ${U.ven.period === 'rango' ? `<div class="toolbar"><div class="field"><label for="ven-from">Desde</label><input type="date" class="input" id="ven-from" value="${U.ven.from}" max="${TODAY()}" data-change="ven-from"></div><div class="field"><label for="ven-to">Hasta</label><input type="date" class="input" id="ven-to" value="${U.ven.to}" max="${TODAY()}" data-change="ven-to"></div>${!(U.ven.from && U.ven.to) ? '<span class="hint" style="align-self:end;padding-bottom:12px">Elegí las dos fechas. Mientras tanto se muestra todo el historial.</span>' : ''}</div>` : ''}
  <div class="eyebrow">${esc(R.label)} · ${fmtDate(R.a)} al ${fmtDate(R.b)}</div>
  <div class="grid g-kpi">

function calendarEvents() {
  const D = TODAY(), y = +D.slice(0, 4);
  const thirdSunOct = yr => { const d1 = new Date(Date.UTC(yr, 9, 1)).getUTCDay(); return fromT(Date.UTC(yr, 9, 1 + ((7 - d1) % 7) + 14)); };
  const easter = yr => { const a = yr % 19, b = Math.floor(yr / 100), c = yr % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451); const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1; return fromT(Date.UTC(yr, mo - 1, da)); };
  const base = [];
  for (const yr of [y, y + 1]) base.push({ name: 'Navidad', date: yr + '-12-25' }, { name: 'Vuelta a la rutina', date: yr + '-03-02' }, { name: 'Pascuas', date: easter(yr) }, { name: 'Día de la Madre', date: thirdSunOct(yr) });
  const all = base.concat(S.events.map(e => ({ name: e.name, date: e.date, custom: true }))).filter(e => e.date >= addDays(D, -3)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 4);
  return all.map(e => {
    const steps = [[-30, 'Preparar stock y fotos'], [-21, 'Publicar orgánico'], [-14, 'Arrancar publicidad'], [-7, 'Escalar lo que funcione'], [-2, 'Último día para pedidos'], [0, e.name]].map(([o, l]) => ({ date: addDays(e.date, o), label: l }));
    return Object.assign(e, { steps, next: steps.find(s => s.date >= D) });
  });
}

/* Frascos para armar del día: lo mismo que Caro anotaba a mano en su Excel */
function armarHoy(day) {
  const D = day || TODAY();
  const os = S.orders.filter(o => isOpen(o) && o.deliveryDate === D && o.status !== 'listo');
  const done = S.orders.filter(o => !o.cancelled && o.deliveryDate === D && (o.status === 'listo' || o.status === 'entregado')).length;
  const by = {}; for (const o of os) for (const it of o.items) by[it.skuId] = (by[it.skuId] || 0) + it.qty;
  const groups = {}; for (const id in by) { const s = skuById(id); const k = s.line ? LINES[s.line].name + ' ' + sizeLabel(s.size) : s.name; (groups[k] = groups[k] || { total: 0, flav: [] }); groups[k].total += by[id]; if (s.line && s.line !== 'natural') groups[k].flav.push([s, by[id]]); }
  const keys = Object.keys(groups).sort((a, b) => groups[b].total - groups[a].total);
  const total = sum(keys, k => groups[k].total);
  const txt = `FRASCOS PARA ARMAR · ${fmtLong(D)}\n` + keys.map(k => `${groups[k].total} × ${k}` + (groups[k].flav.length ? ' (' + groups[k].flav.map(([s, q]) => q + ' ' + FLAVORS[s.flavor].name.toLowerCase()).join(', ') + ')' : '')).join('\n') + `\nTotal: ${total} frascos · ${os.length} pedidos`;
  return { os, done, groups, keys, total, txt };
}

  return `<section class="card armar"><div class="sec-title"><div><h2>Frascos para armar hoy</h2><p class="hint" style="margin:3px 0 0">${a.os.length} ${pl(a.os.length, 'pedido')} por armar para entregar hoy${a.done ? ` · ${a.done} ya ${pl(a.done, 'armado', 'armados')}` : ''}</p></div>${a.total ? `<button class="btn sm" data-act="copy-armar">${ic('copy', 'sm')}Copiar lista</button>` : ''}</div>
    ${a.total ? `<div class="armar-grid">${a.keys.map(k => { const g = a.groups[k]; return `<div class="armar-it"><b>${g.total}</b><span class="ai-name">${esc(k)}</span>${g.flav.length ? `<div class="ai-fl">${g.flav.sort((x, y) => y[1] - x[1]).map(([s, q]) => `<span>${jar(s.flavor, 16)}${q} ${esc(FLAVORS[s.flavor].name.toLowerCase())}</span>`).join('')}</div>` : ''}</div>`; }).join('')}<div class="armar-it tot"><b>${a.total}</b><span class="ai-name">frascos en total</span></div></div>` : `<div class="empty">No quedan frascos por armar para hoy.</div>`}
  </section>`;
}
function prodHoy() {
  const plan = productionPlan();
  const forOrders = sum(plan, p => p.forOrders), forStock = sum(plan, p => p.forStock);
  const orderRows = plan.filter(p => p.missing > 0);
  const stockRows = plan.filter(p => p.forStock > 0);
  const active = S.prodOrders.filter(p => p.status === 'en_curso' || p.status === 'programada').sort((a, b) => a.date.localeCompare(b.date));
  const doneToday = S.prodOrders.filter(p => p.status === 'finalizada' && p.date === TODAY());
  const msg = forOrders ? `Te faltan ${B(forOrders + ' ' + pl(forOrders, 'yogur', 'yogures'))} para cubrir pedidos${forStock ? ` y podés preparar ${forStock} más para reponer stock` : ''}.`
    : forStock ? `Los pedidos están cubiertos. Si querés, podés preparar ${B(forStock + ' ' + pl(forStock, 'unidad', 'unidades'))} para reponer stock.`
      : orderRows.length ? 'Los pedidos que esperan stock quedan cubiertos con lo que ya está en producción.' : 'No hace falta producir nada hoy: el stock y lo que está en marcha cubren todo.';
  const ex = orderRows[0];
  const how = ex ? `Tomamos los pedidos confirmados que todavía no salieron (${ex.confirmed} de ${esc(skuShort(ex.sku))}) y restamos lo que ya está reservado para ellos (${ex.reserved}). Lo reservado sale del stock que ya tenés, empezando por el lote que vence primero. Lo que queda sin cubrir (${ex.missing}) menos lo que ya está en producción (${ex.scheduled}) es lo que falta: ${B(ex.forOrders)}. La reposición se calcula aparte: comparamos lo que te queda disponible con el stock mínimo que configuraste.`
    : 'Tomamos los pedidos confirmados, restamos lo que ya está reservado del stock y lo que ya está en producción. Lo que queda es lo que falta producir. La reposición se calcula aparte con tu stock mínimo.';
  return `${armarCard()}
  ${griBanner(msg, 'brand')}
  <div class="grid g2">
    <section class="card need-card">
      <div class="nc-head nc-orange"><span class="nc-ico">${ic('pot')}</span><div><h2>Necesario para pedidos</h2><p>Lo que hay que producir para cumplir los pedidos confirmados.</p></div></div>
      ${orderRows.length ? `<div class="ptable"><div class="pt-h"><span>Producto</span><span>Pedidos</span><span>Reservado</span><span>En producción</span><span>Faltan</span></div>
        ${orderRows.map(p => `<div class="pt-r"><span class="pt-name">${jar(p.sku.flavor, 30)}<b>${esc(p.sku.name)}</b></span><span data-l="Pedidos">${p.confirmed}</span><span data-l="Reservado">${p.reserved}</span><span data-l="En producción">${p.scheduled}</span><span data-l="Faltan">${p.forOrders ? `<em class="hl">${p.forOrders}</em>` : '<span class="chip good">Cubierto</span>'}</span></div>`).join('')}</div>`
        : `<div class="empty">Todos los pedidos confirmados tienen stock reservado.</div>`}
      ${howTip(how, '¿Cómo calculamos esta cantidad?')}
      <div class="nc-acts"><button class="btn primary" data-act="gri-prodlist" data-arg="pedidos" ${forOrders ? '' : 'disabled'}>${ic('plus', 'sm')}Crear orden de producción</button><button class="btn" data-act="gri-ingredients">${ic('orders', 'sm')}Ver ingredientes necesarios</button></div>
    </section>
    <section class="card need-card">
      <div class="nc-head nc-cream"><span class="nc-ico">${ic('boxes')}</span><div><h2>Reposición opcional</h2><p>Producción extra sugerida para mantener tu stock mínimo. No es obligatoria.</p></div></div>
      ${stockRows.length ? `<div class="ptable pt3"><div class="pt-h"><span>Producto</span><span>Disponible</span><span>Stock mínimo</span><span>Sugerido</span></div>
        ${stockRows.map(p => `<div class="pt-r"><span class="pt-name">${jar(p.sku.flavor, 30)}<b>${esc(p.sku.name)}</b></span><span data-l="Disponible">${p.free}</span><span data-l="Mínimo">${p.sku.min}</span><span data-l="Sugerido"><em class="hl soft">${p.forStock}</em></span></div>`).join('')}</div>
        <p class="hint">Además de lo de los pedidos, podrías producir ${forStock} ${pl(forStock, 'unidad', 'unidades')} para reponer tu stock.</p>
        <div class="nc-acts"><button class="btn" data-act="gri-prodlist" data-arg="stock">${ic('plus', 'sm')}Agregar reposición</button></div>`
        : `<div class="empty">Tu stock está por encima del mínimo en todos los productos.</div>`}
    </section>
  </div>
  <div class="sec-title" style="margin:6px 0 -4px"><h2>Órdenes en marcha</h2><span class="hint">Etapas: ${STAGES.join(' → ')}</span></div>
  <div class="grid g2">${active.map(poCard).join('') || emptyBox('No hay órdenes en curso ni programadas.')}</div>
  ${doneToday.length ? `<div class="sec-title" style="margin:6px 0 -4px"><h2>Terminadas hoy</h2></div><div class="grid g2">${doneToday.map(poCard).join('')}</div>` : ''}`;
}

function vInventario() {
  const t = U.inv.tab;
  return `<div class="wrap">
  ${pageHead('Inventario', 'Lo que tenés para vender, lo reservado para pedidos y tus insumos.', t === 'insumos' ? `<button class="btn primary" data-act="ins-buy">${ic('plus')}Registrar compra</button>` : `<button class="btn" data-act="import" data-arg="stock">${ic('up', 'sm')}Importar stock</button>`)}
  ${seg('inv-tab', t, [['productos', 'Productos terminados'], ['insumos', 'Materias primas e insumos'], ['movimientos', 'Movimientos']])}
  ${t === 'productos' ? invProductos() : t === 'insumos' ? invInsumos() : invMovs()}</div>`;
}
function invProductos() {
  const st = S.skus.map(s => ({ s, k: skuStock(s.id) }));
  const tot = { free: sum(st, x => x.k.free), res: sum(st, x => x.k.reserved), soon: sum(st, x => x.k.soon), exp: sum(st, x => x.k.expired) };
  const stateOf = (s, k) => k.expired ? '<span class="pill p-red">Hay vencidos</span>' : k.soon ? '<span class="pill p-amber">Por vencer</span>' : k.free < s.min ? '<span class="pill p-terra">Stock bajo</span>' : '<span class="pill p-green">Disponible</span>';
  return `<div class="grid g-kpi">
    ${kpi({ icon: 'boxes', label: 'Disponible para vender', value: tot.free, sub: 'sin reservar y sin vencer', bg: 'sage', help: 'Unidades que podés ofrecer ya: no están apartadas para ningún pedido y no vencieron.' })}
    ${kpi({ icon: 'orders', label: 'Reservado', value: tot.res, sub: 'apartado para pedidos', bg: 'blue', help: 'Productos reservados para pedidos: ya tienen dueño. Salen del lote que vence primero.' })}
    ${kpi({ icon: 'clock', label: 'Próximo a vencer', value: tot.soon, sub: 'vence en 3 días o menos', bg: 'amber' })}
    ${kpi({ icon: 'x', label: 'Vencido', value: tot.exp, sub: 'no se entrega nunca', bg: 'red' })}
  </div>
  <section class="card inv-list">
    <div class="sec-title"><h2>Productos</h2><span class="hint">Tocá un producto para ver sus lotes</span></div>
    <div class="inv-h"><span>Producto</span><span>Existencia</span><span>Reservado</span><span>Disponible</span><span>Estado</span></div>
    ${st.map(({ s, k }) => {
    const lots = S.lots.filter(l => l.skuId === s.id && (l.qty > 0 || diffDays(TODAY(), l.made) <= 25)).sort((a, b) => a.expires.localeCompare(b.expires));
    return `<details class="inv-item"><summary><span class="ii-name">${jar(s.flavor, 34)}<span><b>${esc(s.name)}</b><small>mínimo ${s.min} · vida útil ${s.shelf} días</small></span></span><span data-l="Existencia">${k.physical + k.expired}</span><span data-l="Reservado">${k.reserved}</span><span data-l="Disponible"><b>${k.free}</b></span><span>${stateOf(s, k)}</span>${ic('chev', 'sm ii-chev')}</summary>
      <div class="ii-lots">${lots.length ? `<div class="tbl-wrap"><table class="lot-table resp"><thead><tr><th>Lote</th><th>Elaboración</th><th>Vencimiento</th><th class="r">Existencia</th><th class="r">Reservado</th><th class="r">Disponible</th><th>Estado</th><th></th></tr></thead><tbody>
      ${lots.map(l => { const res = l.expires >= TODAY() ? lotReserved(l) : 0; const free = l.expires >= TODAY() ? l.qty - res : 0; const canOff = l.qty > 0 && (l.expires < TODAY() ? l.qty : free) > 0; return `<tr><td data-l="Lote"><b>${esc(l.code)}</b></td><td data-l="Elaboración">${fmtDate(l.made)}</td><td data-l="Vence">${fmtDate(l.expires)} <span class="faint">(${l.expires < TODAY() ? 'hace ' + diffDays(TODAY(), l.expires) + ' d' : diffDays(l.expires, TODAY()) === 0 ? 'hoy' : 'en ' + diffDays(l.expires, TODAY()) + ' d'})</span></td><td class="r" data-l="Existencia">${l.qty}</td><td class="r" data-l="Reservado">${res}</td><td class="r" data-l="Disponible"><b>${free}</b></td><td data-l="Estado">${lotChip(l)}</td><td class="r" data-l="">${canOff ? `<button class="btn sm ghost" data-act="lot-off" data-arg="${l.id}">Dar de baja</button>` : ''}</td></tr>`; }).join('')}
      </tbody></table></div>` : emptyBox('Sin lotes. Creá una orden de producción o importá tu stock inicial.')}</div></details>`;
  }).join('')}
  </section>`;
}
function moveSentence(m) {
  const qa = Math.abs(m.qty);
  if (m.kind === 'insumo') {
    const i = insById(m.insumoId), q = fmtN(qa) + ' ' + i.unit + ' de ' + i.name.toLowerCase();
    return { compra: ['good', 'up', 'Compraste ' + q], consumo: ['', 'pot', 'Se usaron ' + q], desperdicio: ['bad', 'trash', 'Se descartaron ' + q], ajuste: ['info', 'edit', 'Cambió el costo de ' + i.name.toLowerCase()] }[m.type] || ['', 'info', m.type];
  }
  const s = skuById(m.skuId), nm = s ? skuShort(s) : 'producto', r = Math.abs(m.resQty || 0);
  return {
    produccion: ['good', 'up', `${qa === 1 ? 'Ingresó' : 'Ingresaron'} ${qa} ${pl(qa, 'unidad', 'unidades')} de ${nm}`],
    reserva: ['info', 'orders', `${r === 1 ? 'Se reservó' : 'Se reservaron'} ${r} ${pl(r, 'unidad', 'unidades')} de ${nm}`],
    libera: ['info', 'refresh', `${r === 1 ? 'Se liberó' : 'Se liberaron'} ${r} ${pl(r, 'unidad', 'unidades')} de ${nm}`],
    salida: ['', 'truck', `${qa === 1 ? 'Se entregó' : 'Se entregaron'} ${qa} ${pl(qa, 'unidad', 'unidades')} de ${nm}`],
    baja: ['bad', 'trash', `${qa === 1 ? 'Se dio de baja' : 'Se dieron de baja'} ${qa} ${pl(qa, 'unidad', 'unidades')} de ${nm}`],
  }[m.type] || ['', 'info', m.type];
}
function invMovs() {
  const f = U.inv.mv;
  let list = S.moves;
  if (f === 'insumos') list = list.filter(m => m.kind === 'insumo');
  else if (f === 'productos') list = list.filter(m => m.kind === 'producto');
  else if (f !== 'todos') list = list.filter(m => m.insumoId === f || m.skuId === f);
  return `<div class="toolbar"><select class="input" style="width:auto" id="mv-f" data-change="mv-f" aria-label="Filtrar movimientos">
    <option value="todos">Todos los movimientos</option><option value="productos" ${f === 'productos' ? 'selected' : ''}>Solo productos terminados</option><option value="insumos" ${f === 'insumos' ? 'selected' : ''}>Solo insumos</option>
    <optgroup label="Producto">${S.skus.map(s => `<option value="${s.id}" ${f === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</optgroup>
    <optgroup label="Insumo">${S.insumos.map(i => `<option value="${i.id}" ${f === i.id ? 'selected' : ''}>${esc(i.name)}</option>`).join('')}</optgroup></select><span class="muted">${list.length} movimientos</span>${helpTip('Cada cambio de stock queda registrado: qué pasó, cuándo y por qué pedido, lote o compra. Así siempre podés entender por qué cambió una cantidad.')}</div>
  <div class="card"><div class="rows">${list.slice(0, 150).map(m => { const [tone, icon, txt] = moveSentence(m); return `<div class="row mv"><span class="mv-ico t-${tone || 'none'}">${ic(icon, 'sm')}</span><div class="row-main"><div class="row-title" style="font-weight:600">${esc(txt)}</div><div class="row-sub">${esc(m.note || '')}</div></div><div class="row-end"><span class="hint">${relDay(m.date)} ${m.time || ''}</span></div></div>`; }).join('') || emptyBox('Sin movimientos.')}</div></div>`;
}

/* =====================================================================
   COBRAR
   ===================================================================== */
function vCobrar() {
  const D = TODAY(), monday = addDays(D, -((weekday(D) + 6) % 7));
  const owed = S.orders.filter(o => balanceOf(o) > 0);
  const late = owed.filter(o => o.deliveryDate < D).sort((a, b) => a.deliveryDate.localeCompare(b.deliveryDate));
  const partial = owed.filter(o => paidOf(o) > 0 && !late.includes(o));
  const onDelivery = owed.filter(o => !late.includes(o) && !partial.includes(o)).sort((a, b) => a.deliveryDate.localeCompare(b.deliveryDate) || a.slot.localeCompare(b.slot));
  const month = D.slice(0, 7), subsAct = (S.subs || []).filter(x => x.active), subsOwed = subsAct.filter(x => !subMonthPaid(x.id, month));
  const subRow = sb => { const c = clientById(sb.clientId), paid = subMonthPaid(sb.id, month); return `<div class="pay-row"><div class="row-main"><div class="row-title"><button class="linklike" data-act="client" data-arg="${c.id}">${esc(c.name)}</button> ${paid ? '<span class="chip good">Mes pago</span>' : '<span class="chip warn">Falta el pago del mes</span>'}</div><div class="row-sub">${esc(sb.items.map(it => it.qty + ' × ' + skuShort(skuById(it.skuId))).join(', '))} · todos los ${diasPl(sb.weekday)}</div></div><div class="pay-end"><b class="amt">${money(sb.price)}</b>${paid ? '' : `<button class="btn sm primary" data-act="sub-pay" data-arg="${sb.id}">Registrar pago</button>`}</div></div>`; };
  const payToday = S.payments.filter(p => p.date === D), payWeek = S.payments.filter(p => p.date >= monday && p.date <= D);
  const row = (o, extra) => { const c = clientById(o.clientId), paid = paidOf(o); return `<div class="pay-row"><div class="row-main"><div class="row-title"><button class="linklike" data-act="order" data-arg="${o.id}">${esc(c.name)} <span class="faint">#${o.number}</span></button> ${extra || ''}</div><div class="row-sub">${esc(itemsText(o))} · entrega ${relDay(o.deliveryDate).toLowerCase()} · ${STATUS[o.status].toLowerCase()} · ${o.payMethod}</div>${paid ? `<div class="paid-bar"><div class="prog good"><i style="width:${Math.round(paid / o.total * 100)}%"></i></div><span class="hint">Pagó ${money(paid)} de ${money(o.total)}</span></div>` : ''}</div><div class="pay-end"><b class="amt">${money(balanceOf(o))}</b><button class="btn sm primary" data-act="pay" data-arg="${o.id}">Registrar cobro</button></div></div>`; };
  const hist = S.payments.filter(p => U.cob.hist === 'todos' || p.method === U.cob.hist).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)).slice(0, 30);
  const block = (tone, title, total, help, body) => `<section class="card pay-block pb-${tone}"><div class="pb-head"><div><h2>${title}</h2>${help ? `<p>${help}</p>` : ''}</div><b class="pb-total">${money(total)}</b></div><div class="rows">${body}</div></section>`;
  return `<div class="wrap">
  ${pageHead('Cobrar', 'Lo que te deben y lo que ya entró. Cobrar y entregar son procesos separados.')}
  <div class="grid g-kpi">
    ${kpi({ icon: 'wallet', label: 'Pendiente de cobrar', value: money(sum(owed, balanceOf) + sum(subsOwed, x => x.price)), sub: owed.length + ' pedidos con saldo' + (subsOwed.length ? ' + ' + subsOwed.length + (subsOwed.length === 1 ? ' suscripción' : ' suscripciones') : ''), bg: 'amber', small: true, help: 'Todo lo que te deben, de pedidos entregados o por entregar. No incluye pedidos cancelados.' })}
    ${kpi({ icon: 'cash', label: 'Cobraste hoy', value: money(sum(payToday, p => p.amount)), sub: payToday.length + ' cobros', bg: 'green', small: true })}
    ${kpi({ icon: 'calendar', label: 'Cobraste esta semana', value: money(sum(payWeek, p => p.amount)), sub: 'desde el lunes ' + fmtDate(monday), bg: 'green', small: true })}
    ${kpi({ icon: 'alert', label: 'Atrasados', value: money(sum(late, balanceOf)), sub: late.length + ' pedidos de días anteriores', bg: 'red', small: true })}
  </div>
  <div class="grid g-main">
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      ${block('red', 'Atrasados', sum(late, balanceOf), 'Entregas de días anteriores que todavía no se cobraron.', late.map(o => row(o, `<span class="chip ${diffDays(D, o.deliveryDate) > 5 ? 'bad' : 'warn'}">${ago(o.deliveryDate)}</span>`)).join('') || emptyBox('No hay deudas atrasadas.'))}
      ${block('amber', 'Señas y pagos parciales', sum(partial, balanceOf), 'Pagaron una parte. Cuando entra el resto, el pedido queda saldado.', partial.map(o => row(o)).join('') || emptyBox('No hay pagos parciales abiertos.'))}
      ${subsAct.length ? block(subsOwed.length ? 'amber' : 'green', 'Suscripciones de ' + MESES_L[+month.slice(5, 7) - 1], sum(subsOwed, x => x.price), 'Pagan el mes por adelantado y reciben sus yogures todas las semanas. Las entregas no generan cobros sueltos.', subsAct.map(subRow).join('')) : ''}
      ${block('amber', 'A cobrar en la entrega', sum(onDelivery, balanceOf), 'Pedidos de hoy en adelante que todavía no pagaron.', onDelivery.map(o => row(o)).join('') || emptyBox('No hay pedidos pendientes de cobro.'))}
    </div>
    <section class="card pay-block pb-green"><div class="pb-head"><div><h2>Cobrado</h2><p>Lo que ya entró, por fecha de cobro.</p></div></div>
      <div style="margin-bottom:8px">${seg('cob-h', U.cob.hist, [['todos', 'Todos'], ['efectivo', 'Efectivo'], ['transferencia', 'Transferencia']])}</div>
      <div class="rows">${hist.map(p => { if (!p.orderId) { const sb = subById(p.subId), sc = sb && clientById(sb.clientId); return `<div class="row click" data-act="client" data-arg="${sc ? sc.id : ''}"><div class="row-main"><div class="row-title">${esc(sc ? sc.name : 'Suscripción')} <span class="chip sage">Suscripción</span></div><div class="row-sub">${relDay(p.date)} ${p.time} · mes de ${MESES_L[+p.month.slice(5, 7) - 1]} · ${p.method}</div></div><b class="amt" style="color:var(--good)">+${money(p.amount)}</b></div>`; } const o = orderById(p.orderId); return `<div class="row click" data-act="order" data-arg="${o.id}"><div class="row-main"><div class="row-title">${esc(clientById(o.clientId).name)} <span class="faint" style="font-weight:600">#${o.number}</span></div><div class="row-sub">${relDay(p.date)} ${p.time} · ${p.kind} · ${p.method}</div></div><b class="amt" style="color:var(--good)">+${money(p.amount)}</b></div>`; }).join('') || emptyBox('Sin cobros.')}</div></section>
  </div></div>`;
}

const tagChip = t => `<span class="chip ${t === 'vip' ? 'terra' : t === 'recompra' ? 'sage' : t === 'inactivo' ? '' : t === 'nuevo' ? 'info' : 'good'}">${TAGS[t]}</span>`;
function vClientes() {
  computeVip();
  const all = S.clients.map(c => { const st = clientStats(c); return { c, st, tags: clientTags(c, st) }; });
  const counts = {}; for (const x of all) for (const t of x.tags) counts[t] = (counts[t] || 0) + 1;
  const q = U.cli.q.toLowerCase(), qd = q.replace(/\D/g, '');
  const list = all.filter(x => (U.cli.tag === 'todos' || x.tags.includes(U.cli.tag)) && (!q || x.c.name.toLowerCase().includes(q) || (qd && (x.c.phone || '').replace(/\D/g, '').includes(qd)))).sort((a, b) => b.st.total - a.st.total);
  return `<div class="wrap">
  ${pageHead('Clientes', 'Quién te compra, cada cuánto y qué. Las etiquetas se calculan solas con el historial.', `<button class="btn" data-act="import" data-arg="clientes">${ic('up', 'sm')}Importar desde Excel</button>`)}

function unitsIn(a, b, pred) { let u = 0; for (const o of S.orders.filter(o => !o.cancelled && o.createdAt >= a && o.createdAt <= b)) for (const it of o.items) if (pred(it)) u += it.qty; return u; }
function stratData() {

    return { s, u, rev, gp, m: rev ? gp / rev : 0, unitM: (s.price - skuCost(s).total) / s.price };
  }).sort((a, b) => b.gp - a.gp);
  const byMargin = per.filter(p => p.s.price).slice().sort((a, b) => b.unitM - a.unitM);
  const wd = [0, 0, 0, 0, 0, 0, 0]; for (const o of S.orders.filter(o => !o.cancelled && o.deliveryDate < D && o.deliveryDate > addDays(D, -60))) wd[weekday(o.deliveryDate)]++;

  const soon = sum(S.skus, s => skuStock(s.id).soon);
  const chan = {}; for (const o of recent) { chan[o.channel] = chan[o.channel] || { t: 0, n: 0 }; chan[o.channel].t += o.total; chan[o.channel].n++; }
  const chBest = Object.keys(chan).filter(k => k !== 'mayorista').sort((a, b) => chan[b].t / chan[b].n - chan[a].t / chan[a].n)[0];
  const top80 = (() => { const tot = sum(per, p => p.gp); let acc = 0, n = 0; for (const p of per) { acc += p.gp; n++; if (acc >= tot * .8) break; } return n; })();

    <div class="field"><label for="est-disc">Descuento del pack: <b>${U.est.disc}%</b></label><input type="range" class="range" id="est-disc" min="0" max="25" value="${U.est.disc}" data-input="est-disc"></div></div>
    <div class="scenario-out"><div class="stat"><small>Precio del pack (4 × ${esc(sizeLabel(nat500.size))})</small><b>${money(packPrice)}</b></div><div class="stat"><small>Ganancia bruta por pack</small><b>${money(packGp)} · ${pctTxt(packGp / packPrice)}</b></div><div class="stat"><small>Ganancia bruta estimada por mes</small><b>${money(packGp * monthPacks)}</b></div></div>
  </div>
  <div class="card"><div class="sec-title"><h2>Calendario comercial</h2><button class="btn sm" data-act="ev-new">${ic('plus', 'sm')}Fecha</button></div>
    ${evs.map(e => `<div class="cal-ev"><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(e.name)}</b><span class="num muted">${fmtDate(e.date)}</span></div><div class="hint" style="color:var(--terra-ink);font-weight:700">${e.next ? (e.next.date === d.D ? 'Hoy: ' : 'Próximo: ') + e.next.label + ' · ' + fmtDate(e.next.date) : ''}</div>
      <div class="cal-steps">${e.steps.map(s => `<span class="${s.date < d.D ? 'past' : s.date === d.D ? 'now' : ''}">${fmtDate(s.date)} ${s.label}</span>`).join('')}</div></div>`).join('')}

}

'use strict';
/* =====================================================================
   gri.js — Gri, la asistente de Griega.
   Motor local: lee el estado real de la demo y arma recomendaciones y respuestas
   con reglas. No llama a ninguna IA.

   Para integrar una IA más adelante:
   - griContext() devuelve un resumen estructurado del negocio.
   - GRI_ENGINE.ask(pregunta) es el único punto de entrada del chat. Se puede reemplazar
     por una llamada a un backend propio que reciba { pregunta, contexto: griContext() }
     y devuelva { html, actions }. Las acciones siguen pasando por ACT y A.*, con las
     mismas validaciones y confirmaciones que usa la interfaz.
   ===================================================================== */

const LEVELS = {
  urgente: { label: 'Urgente', tone: 'red', rank: 0 },
  hoy: { label: 'Hoy', tone: 'amber', rank: 1 },
  semana: { label: 'Esta semana', tone: 'green', rank: 2 },
  info: { label: 'Para tener en cuenta', tone: 'blue', rank: 3 },
};
const fname = c => c.biz ? c.name : c.name.split(' ')[0];
const joinList = a => a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' y ' + a[a.length - 1];
const pl = (n, s, p) => n === 1 ? s : (p || s + 's');
const nowHour = () => new Date().getHours() + new Date().getMinutes() / 60;
const slotH = s => +s.slice(0, 2);
const missMap = orders => { const m = {}; for (const o of orders) { const s = shortage(o); for (const k in s) m[k] = (m[k] || 0) + s[k]; } return m; };
const skuList = m => Object.keys(m).map(k => m[k] + ' × ' + skuShort(skuById(k)));
const B = s => '<b>' + esc(s) + '</b>';

/* ---------- Recomendaciones priorizadas ----------
   Cada una: title (qué hacer), reason (por qué), level, todo (frase para el resumen), actions. */
function griRecs() {
  const D = TODAY(), out = [];
  const open = S.orders.filter(isOpen);
  const today = open.filter(o => o.deliveryDate <= D);
  const plan = productionPlan();
  const sched = {}; for (const p of plan) sched[p.sku.id] = p.scheduled;
  const add = r => out.push(r);

  for (const o of open.filter(o => o.ship && o.ship.incident)) {
    const c = clientById(o.clientId);
    add({ id: 'inc-' + o.id, level: 'urgente', score: 100, icon: 'alert', title: `Resolver el envío de ${fname(c)}`, reason: `Tuvo un problema: ${o.ship.incident.type.toLowerCase()}. Conviene resolverlo antes de que se corra el horario.`, todo: `resolver el envío de ${fname(c)}`,
      actions: [{ label: 'Ver envío', act: 'go-ship', arg: o.id, primary: true }] });
  }
  const lateDel = open.filter(o => o.deliveryDate < D);
  if (lateDel.length) add({ id: 'late', level: 'urgente', score: 95, icon: 'clock', title: `Reprogramar ${lateDel.length === 1 ? 'un pedido atrasado' : lateDel.length + ' pedidos atrasados'}`, reason: `Tenían que salir antes de hoy: ${joinList(lateDel.map(o => '#' + o.number + ' de ' + fname(clientById(o.clientId))))}.`, todo: 'reprogramar pedidos atrasados',
    actions: [{ label: 'Ver pedidos', act: 'go', arg: 'pedidos', primary: true }] });

  const shortToday = today.filter(o => !fullyReserved(o));
  const missToday = missMap(shortToday);
  const uncovered = {}; for (const k in missToday) { const u = missToday[k] - (sched[k] || 0); if (u > 0) uncovered[k] = u; }
  const forOrders = sum(plan, p => p.forOrders), forStock = sum(plan, p => p.forStock);
  if (Object.keys(uncovered).length) {
    const first = shortToday.slice().sort((a, b) => a.slot.localeCompare(b.slot))[0];
    add({ id: 'short-today', level: 'urgente', score: 90, icon: 'pot', title: 'Producir lo que falta para hoy', brief: `Faltan unidades para entregas desde las ${slotStart(first.slot)}.`, reason: `Faltan ${joinList(skuList(uncovered))} para pedidos que salen desde las ${slotStart(first.slot)}. Te puedo organizar la producción.`, todo: 'producir lo que falta para las entregas de hoy',
      actions: [{ label: 'Organizar producción', act: 'gri-prodlist', arg: 'pedidos', primary: true }] });
  } else if (forOrders) {
    add({ id: 'prod', level: 'hoy', score: 80, icon: 'pot', title: 'Completar la producción pendiente', brief: `Faltan ${forOrders} ${pl(forOrders, 'unidad', 'unidades')} para los pedidos confirmados.`, reason: `Tenemos que preparar ${forOrders} ${pl(forOrders, 'unidad', 'unidades')} para cubrir los pedidos confirmados. Te puedo organizar la producción.`, todo: 'completar la producción pendiente',
      actions: [{ label: 'Organizar producción', act: 'gri-prodlist', arg: 'pedidos', primary: true }] });
  }
  if (!forOrders && forStock) add({ id: 'restock', level: 'semana', score: 48, icon: 'boxes', title: 'Reponer stock mínimo', reason: `Los pedidos están cubiertos. Con ${forStock} ${pl(forStock, 'unidad', 'unidades')} más llegás a tu stock mínimo.`, todo: '',
    actions: [{ label: 'Ver producción', act: 'go', arg: 'produccion', primary: true }] });
  if (Object.keys(missToday).length && !Object.keys(uncovered).length) {
    const inProg = S.prodOrders.filter(p => (p.status === 'en_curso' || p.status === 'programada') && missToday[p.skuId]);
    add({ id: 'wait-prod', level: 'info', score: 40, icon: 'pot', title: 'Pedidos esperando producción', reason: `Quedan cubiertos con ${joinList(inProg.map(p => p.qty + ' × ' + skuShort(skuById(p.skuId))))}. Al finalizarla se reservan solos.`, todo: '',
      actions: [{ label: 'Ir a producción', act: 'go', arg: 'produccion', primary: true }] });
  }
  const pending = S.prodOrders.filter(p => p.status === 'programada' && p.date <= D);
  if (pending.length && !forOrders) add({ id: 'prog', level: 'hoy', score: 70, icon: 'pot', title: 'Arrancar la producción programada', reason: `${pending.length === 1 ? 'Hay una orden' : 'Hay ' + pending.length + ' órdenes'} para hoy sin empezar: ${joinList(pending.map(p => p.qty + ' × ' + skuShort(skuById(p.skuId))))}.`, todo: 'arrancar la producción programada',
    actions: [{ label: 'Ir a producción', act: 'go', arg: 'produccion', primary: true }] });

  const ready = today.filter(o => o.ship && o.ship.status === 'pendiente' && o.status === 'listo').sort((a, b) => a.slot.localeCompare(b.slot));
  if (ready.length) {
    const soon = slotH(ready[0].slot) <= nowHour() + 1, o = ready[0], via = o.delivery === 'uber' ? 'Uber' : 'envío';
    add({ id: 'uber', level: soon ? 'urgente' : 'hoy', score: soon ? 92 : 85, icon: 'car',
      title: ready.length === 1 ? `Solicitar ${via} para ${fname(clientById(o.clientId))}` : `Solicitar ${ready.length} envíos`,
      reason: ready.length === 1 ? `Su pedido ya está listo y sale a las ${slotStart(o.slot)}. Te dejé los datos listos para copiar.` : `Ya están listos: ${joinList(ready.map(x => fname(clientById(x.clientId)) + ' (' + slotStart(x.slot) + ')'))}.`,
      todo: ready.length === 1 ? `coordinar el ${via} de ${fname(clientById(o.clientId))}` : `coordinar ${ready.length} envíos`,
      actions: [{ label: ready.length === 1 ? 'Gestionar envío' : 'Gestionar envíos', act: ready.length === 1 ? 'go-ship' : 'go', arg: ready.length === 1 ? o.id : 'envios', primary: true }] });
  }

  const needIns = {};
  for (const p of plan) for (const k in p.sku.recipe) needIns[k] = (needIns[k] || 0) + p.sku.recipe[k] * p.need;
  for (const p of S.prodOrders.filter(p => p.status === 'programada' || p.status === 'en_curso')) { const s = skuById(p.skuId); for (const k in s.recipe) needIns[k] = (needIns[k] || 0) + s.recipe[k] * p.qty; }
  const blocking = S.insumos.filter(i => (needIns[i.id] || 0) > i.stock + 1e-9);
  for (const i of blocking) add({ id: 'ins-block-' + i.id, level: 'urgente', score: 88, icon: 'bag', title: `Comprar ${i.name.toLowerCase()}`, brief: 'No alcanza para la producción pendiente.', reason: `Para la producción pendiente necesitamos ${fmtN(needIns[i.id])} ${i.unit} y hay ${fmtN(i.stock)} ${i.unit}.`, todo: `comprar ${i.name.toLowerCase()}`,
    actions: [{ label: 'Ver cuánto comprar', act: 'gri-buy', arg: i.id, primary: true }] });
  const low = S.insumos.filter(i => i.stock < i.min && !blocking.includes(i));
  if (low.length === 1) { const i = low[0]; add({ id: 'ins-' + i.id, level: 'hoy', score: 60, icon: 'bag', title: `Revisar el stock de ${i.name.toLowerCase()}`, brief: `Quedan ${fmtN(i.stock)} ${i.unit}, por debajo del mínimo de ${fmtN(i.min)} ${i.unit}.`, reason: `Nos estamos quedando sin ${i.name.toLowerCase()}: hay ${fmtN(i.stock)} ${i.unit} y el mínimo es ${fmtN(i.min)} ${i.unit}. ¿Revisamos cuánto comprar?`, todo: `revisar el stock de ${i.name.toLowerCase()}`,
    actions: [{ label: 'Ver cuánto comprar', act: 'gri-buy', arg: i.id, primary: true }] }); }
  else if (low.length > 1) add({ id: 'ins-many', level: 'hoy', score: 60, icon: 'bag', title: `Revisar ${low.length} insumos`, reason: `Están por debajo del mínimo: ${joinList(low.map(i => i.name.toLowerCase()))}.`, todo: 'revisar insumos que se están acabando',
    actions: [{ label: 'Ver insumos', act: 'gri-ins', primary: true }] });

  const expLots = S.lots.filter(l => l.qty > 0 && l.expires < D), expU = sum(expLots, l => l.qty);
  if (expU) add({ id: 'expired', level: 'hoy', score: 55, icon: 'trash', title: `Dar de baja ${expU} ${pl(expU, 'unidad vencida', 'unidades vencidas')}`, reason: `Son del lote ${joinList(expLots.map(l => l.code))}. No se usan en pedidos; darlas de baja deja el stock al día.`, todo: 'dar de baja lo vencido',
    actions: [{ label: 'Dar de baja', act: 'gri-writeoff', primary: true }] });

  const owedLate = S.orders.filter(o => balanceOf(o) > 0 && o.deliveryDate < D).sort((a, b) => balanceOf(b) - balanceOf(a));
  if (owedLate.length) { const c = clientById(owedLate[0].clientId); add({ id: 'owed', level: 'hoy', score: 58, icon: 'wallet', title: `Cobrar ${money(sum(owedLate, balanceOf))} atrasados`, brief: `${owedLate.length} ${pl(owedLate.length, 'pedido')} de días anteriores sin cobrar.`, reason: `${fname(c)}${owedLate.length > 1 ? ` y ${owedLate.length - 1} ${pl(owedLate.length - 1, 'cliente más', 'clientes más')}` : ''} ${owedLate.length > 1 ? 'tienen' : 'tiene'} saldo de entregas anteriores.`, todo: 'ponernos al día con los cobros',
    actions: [{ label: 'Ver cobros', act: 'go', arg: 'cobrar', primary: true }] }); }

  const soonLots = S.lots.filter(l => l.qty > 0 && lotState(l) === 'proximo');
  const soonFree = sum(soonLots, l => lotFree(l)), soonRes = sum(soonLots, l => lotReserved(l));
  if (soonFree > 0) add({ id: 'soon', level: 'semana', score: 50, icon: 'clock', title: `Ofrecer ${soonFree} ${pl(soonFree, 'unidad', 'unidades')} que vencen pronto`, reason: `No están reservadas y vencen en 3 días o menos. Un topping de regalo puede moverlas.`, todo: '',
    actions: [{ label: 'Copiar promo', act: 'gri-promo', primary: true }] });
  computeVip();
  const reco = S.clients.map(c => ({ c, st: clientStats(c) })).filter(x => clientTags(x.c, x.st).includes('recompra')).sort((a, b) => b.st.total - a.st.total);
  if (reco.length) add({ id: 'reco', level: 'semana', score: 45, icon: 'users', title: `Escribirle a ${reco.length} ${pl(reco.length, 'cliente')} que ${pl(reco.length, 'suele', 'suelen')} reponer`, reason: `${joinList(reco.slice(0, 3).map(x => fname(x.c)))}${reco.length > 3 ? ' y otros' : ''} ya pasaron su tiempo habitual entre compras.`, todo: '',
    actions: [{ label: 'Copiar mensaje', act: 'copy-wa', arg: reco[0].c.id, primary: true }, { label: 'Ver clientes', act: 'cli-tag', arg: 'recompra' }] });


  { const month = D.slice(0, 7), unpaid = (S.subs || []).filter(x => x.active && !subMonthPaid(x.id, month));
    if (unpaid.length) add({ id: 'subpay', level: +D.slice(8) <= 10 ? 'hoy' : 'semana', score: 58, icon: 'wallet', title: `Cobrar ${unpaid.length === 1 ? 'la suscripción de ' + fname(clientById(unpaid[0].clientId)) : unpaid.length + ' suscripciones'} de ${MESES_L[+month.slice(5, 7) - 1]}`, reason: `Son ${money(sum(unpaid, x => x.price))} que se pagan a principio de mes. Las entregas siguen saliendo, así que conviene cobrarlo antes de la próxima.`, todo: '',
      actions: [{ label: 'Registrar pago', act: 'sub-pay', arg: unpaid[0].id, primary: true }, { label: 'Ver cobros', act: 'go', arg: 'cobrar' }] }); }
  { const many = S.clients.map(c => ({ c, n: jarsOf(c) })).filter(x => x.n >= 6).sort((a, b) => b.n - a.n);
    if (many.length) add({ id: 'jars', level: 'info', score: 28, icon: 'refresh', title: `Pedir frascos a ${many.length} ${pl(many.length, 'cliente')}`, reason: `${joinList(many.slice(0, 3).map(x => fname(x.c) + ' (' + x.n + ')'))}${many.length > 3 ? ' y otros' : ''} ${pl(many.length, 'tiene', 'tienen')} muchos frascos tuyos. Recordales el canje: se llevan ${money(jarRate())} de descuento por frasco y vos ahorrás envases.`, todo: '',
      actions: [{ label: 'Ver ' + fname(many[0].c), act: 'client', arg: many[0].c.id, primary: true }] }); }
  const cashToday = today.filter(o => balanceOf(o) > 0);
  if (cashToday.length) add({ id: 'cash', level: 'info', score: 30, icon: 'cash', title: `Cobrar ${money(sum(cashToday, balanceOf))} en las entregas de hoy`, reason: `${cashToday.length} ${pl(cashToday.length, 'pedido')}: ${money(sum(cashToday.filter(o => o.payMethod === 'efectivo'), balanceOf))} en efectivo, el resto por transferencia.`, todo: '',
    actions: [{ label: 'Ver cobros', act: 'go', arg: 'cobrar', primary: true }] });
  const tom = open.filter(o => o.deliveryDate === addDays(D, 1));
  if (tom.length) add({ id: 'tomorrow', level: 'info', score: 25, icon: 'calendar', title: `Mañana: ${tom.length} ${pl(tom.length, 'pedido')}`, reason: tom.some(o => !fullyReserved(o)) ? `${tom.filter(o => !fullyReserved(o)).length} todavía esperan producción.` : 'Todo el stock ya está reservado.', todo: '',
    actions: [{ label: 'Ver pedidos de mañana', act: 'gri-tomorrow', primary: true }] });
  if (soonRes > 0 && !soonFree) add({ id: 'soon-ok', level: 'info', score: 20, icon: 'clock', title: 'Lo que vence pronto ya está reservado', reason: `Las ${soonRes} unidades salen en pedidos antes de vencer.`, todo: '', actions: [{ label: 'Ver lotes', act: 'go', arg: 'inventario', primary: true }] });

  return out.map(r => Object.assign(r, { text: r.title + '. ' + r.reason })).sort((a, b) => LEVELS[a.level].rank - LEVELS[b.level].rank || b.score - a.score);
}

/* ---------- Resumen de bienvenida (sin repetir las cifras de las tarjetas) ---------- */
function griSummary(recs) {
  const D = TODAY(), LW = addDays(D, -7), dn = DIAS[weekday(D)];
  const sales = sum(S.orders.filter(o => !o.cancelled && o.createdAt === D), o => o.total), prev = sum(S.orders.filter(o => !o.cancelled && o.createdAt === LW), o => o.total);
  const top = recs.filter(r => (r.level === 'urgente' || r.level === 'hoy') && r.todo);
  const words = ['', 'una cosa importante', 'dos cosas importantes', 'tres cosas importantes'];
  let p1 = '';
  if (top.length) {
    const shown = top.slice(0, 3).map(r => r.todo);
    p1 = top.length <= 3 ? `Hoy tenemos ${words[top.length]} para resolver: ${esc(joinList(shown))}.` : `Hoy tenemos ${top.length} cosas para resolver. Las más importantes: ${esc(joinList(shown))}.`;
  } else p1 = 'No hay nada urgente: lo de hoy está encaminado.';
  let p2 = '';
  if (!sales) p2 = ' Todavía no entraron ventas hoy.';
  else if (prev) { const r = (sales - prev) / prev; p2 = r >= .1 ? ` Las ventas vienen muy bien respecto del ${dn} pasado.` : r <= -.1 ? ` Las ventas vienen más tranquilas que el ${dn} pasado.` : ` Las ventas vienen parecidas al ${dn} pasado.`; }

function parseCSV(text) {
  const first = text.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : (first.includes('\t') ? '\t' : ',');
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; continue; }
    if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}

  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
  else if (s.includes(',')) s = s.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  return parseFloat(s);
}

}

/* ---------- Armado de pantalla ---------- */
const brandHtml = (compact) => S.config.brand.trim().toLowerCase() === 'la griega'
  ? `<div class="brand"><span class="brand-logo"><img src="${LOGO}" alt="La Griega"></span>${compact ? '' : `<div class="brand-tag">${esc(S.config.tagline)}</div>`}</div>`
  : `<div class="brand"><span class="brand-mark">${esc(S.config.brand.trim().charAt(0).toUpperCase())}</span><div><div class="brand-name">${esc(S.config.brand)}</div>${compact ? '' : `<div class="brand-tag">${esc(S.config.tagline)}</div>`}</div></div>`;
function renderChrome() {
  const b = navBadges(), dark = isDark();
  $('#side').innerHTML = `${brandHtml()}<nav class="nav" aria-label="Secciones">${NAV.map(([id, l, icn]) => `<a href="#${id}" class="${U.view === id ? 'on' : ''}" ${U.view === id ? 'aria-current="page"' : ''}>${ic(icn)}<span>${l}</span>${b[id] || ''}</a>`).join('')}</nav>
    <div class="side-cta"><button class="btn primary lg block" data-act="new-order">${ic('plus')}Nuevo pedido</button></div>
    <button class="side-gri" data-act="gri-open" data-tour="gri">${griAvatar('md')}<span><b>Preguntale a Gri</b><small>Tu asistente</small></span></button>
    <div class="side-foot"><button class="btn soft block" data-act="tour">${ic('info', 'sm')}¿Cómo funciona?</button><span class="demo-pill" style="align-self:flex-start"><i></i>Modo demostración</span>
      <div class="user"><span class="avatar">${esc(initials(S.config.user))}</span><div style="min-width:0"><b>${esc(S.config.user)}</b><small>${esc(S.config.role)}</small></div></div>
      <div class="side-tools"><button class="btn sm" data-act="theme">${ic(dark ? 'sun' : 'moon', 'sm')}${dark ? 'Claro' : 'Oscuro'}</button><button class="btn sm" data-act="config">${ic('gear', 'sm')}Ajustes</button></div></div>`;
  $('#topbar').innerHTML = `${brandHtml(true)}<div class="t-end"><span class="demo-pill"><i></i>Demo</span><button class="top-gri" data-act="gri-open" data-tour="gri" aria-label="Preguntale a Gri">${griAvatar('sm')}</button><button class="btn icon sm ghost" data-act="tour" aria-label="¿Cómo funciona?">${ic('info', 'sm')}</button><button class="btn icon sm ghost" data-act="theme" aria-label="Cambiar tema">${ic(dark ? 'sun' : 'moon', 'sm')}</button><button class="btn icon sm ghost" data-act="config" aria-label="Configuración">${ic('gear', 'sm')}</button></div>`;
  const bn = (id, l, icn) => `<a href="#${id}" class="${U.view === id ? 'on' : ''}">${ic(icn)}<span>${l}</span>${b[id] ? b[id].replace('class="badge', 'class="badge bn-badge') : ''}</a>`;
  $('#bnav').innerHTML = bn('inicio', 'Inicio', 'home') + bn('pedidos', 'Pedidos', 'orders') + `<button class="plus" data-act="new-order" aria-label="Nuevo pedido">${ic('plus')}</button>` + bn('envios', 'Envíos', 'truck') + `<button data-act="more" class="${['produccion', 'inventario', 'ventas', 'cobrar', 'clientes', 'estrategia'].includes(U.view) ? 'on' : ''}">${ic('menu')}<span>Más</span></button>`;
}
function render() {
  const ae = document.activeElement, fid = ae && ae.id && !ae.closest('#overlay-root') ? ae.id : null;
  let sel = null; try { if (fid && ae.selectionStart != null) sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { }
  renderChrome();
  try { $('#main').innerHTML = (VIEWS[U.view] || vInicio)(); }
  catch (e) { console.error(e); $('#main').innerHTML = `<div class="wrap"><div class="card"><h2 class="serif">No se pudo mostrar esta sección</h2><p class="muted">${esc(e.message)}</p><button class="btn primary" data-act="reset">Restablecer demo</button></div></div>`; }
  if (U.gri.open && !(ae && ae.closest && ae.closest('#gri-panel'))) griRenderPanel();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { } } }
}
function go(view) { if (location.hash !== '#' + view) location.hash = view; else { U.view = view; render(); } }

/* ---------- Acciones de interfaz ---------- */
const backTo = el => el && el.dataset.back && M.ctx && M.ctx.order ? (id => () => openOrder(id))(M.ctx.order) : null;
const ACT = {
  close: () => closeModal(),
  go: a => { closeModal(); go(a); },
  'new-order': a => { closeModal(); openOrderForm(null, a || null); },
  order: a => openOrder(a),
  'edit-order': a => { closeModal(); openOrderForm(a); },
  'cancel-order': a => { const o = orderById(a); openConfirm(`Cancelar pedido #${o.number}`, `Se libera el stock reservado y el pedido deja de contar en ventas y cobros.${paidOf(o) ? ' Ya cobraste ' + money(paidOf(o)) + ': la devolución se registra por fuera.' : ''}`, 'Cancelar pedido', () => A.cancelOrder(a), true); },
  move: (a, el) => { const back = backTo(el); const ok = run(() => A.moveOrder(a, el.dataset.to)); if (ok && back) { closeModal(); back(); } },
  'go-ship': a => { const o = orderById(a); closeModal(); U.env.date = o.deliveryDate === TODAY() ? 'hoy' : o.deliveryDate === addDays(TODAY(), 1) ? 'manana' : o.deliveryDate; go('envios'); },
  pay: (a, el) => { const back = backTo(el); openPay(a, back); },
  'pm-quick': a => { $('#pm-amount').value = a; },
  'pm-method': (a, el) => { M.ctx.method = a; el.parentElement.querySelectorAll('.opt').forEach(b => b.classList.toggle('on', b === el)); },
  'copy-route': () => {
    const D = TODAY(); const date = U.env.date === 'hoy' ? D : U.env.date === 'manana' ? addDays(D, 1) : U.env.date;
    const list = S.orders.filter(o => !o.cancelled && o.ship && o.deliveryDate === date && o.ship.status !== 'entregado').sort((a, b) => a.slot.localeCompare(b.slot));
    if (!list.length) { toast('No hay envíos pendientes para ese día.', 'err'); return; }
    const txt = `HOJA DE RUTA · ${fmtLong(date)}\n\n` + list.map(o => { const a = orderAddr(o), bal = balanceOf(o); return `${o.slot} · #${o.number} ${clientById(o.clientId).name}\n${a.address}, ${a.barrio}${a.ref ? ' (' + a.ref + ')' : ''}\n${itemsText(o)}\n${DELIVERY[o.delivery]} · ${STATUS[o.status]}${bal > 0 ? ' · cobrar ' + money(bal) + ' ' + o.payMethod : ' · pagado'}`; }).join('\n\n') + `\n\nTotal: ${list.length} envíos`;
    copyText(txt, 'Hoja de ruta copiada (' + list.length + ' envíos)');
  },
  'copy-ship': a => copyText(shipText(orderById(a)), 'Datos del pedido copiados'),
  uber: a => { copyText(shipText(orderById(a)), 'Datos copiados. Se abrió Uber en otra pestaña.'); },
  'ship-assign': a => openAssign(a),
  'ship-pickup': a => run(() => A.shipPickup(a)),
  'ship-deliver': a => run(() => A.shipDeliver(a)),
  'ship-incident': a => openIncident(a),
  'ship-resolve': a => run(() => A.shipResolve(a, false)),
  'ship-retry': a => run(() => A.shipResolve(a, true)),
  'env-date': a => { U.env.date = a; render(); },
  'env-done': () => { U.env.showDone = !U.env.showDone; render(); },
  'ped-date': a => { U.ped.date = a; render(); },
  'ped-mob': a => { U.ped.mob = a; render(); },
  'prod-tab': a => { U.prod.tab = a; render(); },
  'po-new': (a, el) => { closeModal(); openPONew(a || null, el && el.dataset.qty ? +el.dataset.qty : null); },
  'po-start': a => run(() => A.startPO(a)),
  'po-advance': a => run(() => 'Etapa: ' + A.advancePO(a)),
  'po-finish': a => openPOFinish(a),
  'po-cancel': a => openConfirm('Cancelar orden', 'La orden se cierra sin crear lote ni consumir insumos.', 'Cancelar orden', () => A.cancelPO(a), true),
  'sim-reset': () => { U.sim.milk = null; render(); },
  'sim-save': () => { run(() => A.setInsumoCost('leche', U.sim.milk)); U.sim.milk = null; render(); },
  'sku-edit': a => openSkuEdit(a),
  'inv-tab': a => { U.inv.tab = a; render(); },
  'ins-buy': a => openInsBuy(a || null),
  'ins-waste': a => openInsWaste(a),
  'ins-min': a => openInsMin(a),
  'ins-hist': a => { U.inv.tab = 'movimientos'; U.inv.mv = a; go('inventario'); render(); },
  'lot-off': a => openLotOff(a),
  'ven-p': a => { U.ven.period = a; U.ven.all = false; if (a === 'rango' && !U.ven.from) { U.ven.from = addDays(TODAY(), -13); U.ven.to = TODAY(); } render(); },
  'ven-b': a => { U.ven.basis = a; render(); },
  'ven-all': () => { U.ven.all = !U.ven.all; render(); },
  'day-sales': a => { U.ven.period = 'rango'; U.ven.from = a; U.ven.to = a; go('ventas'); },
  'cob-h': a => { U.cob.hist = a; render(); },
  'cli-tag': a => { U.cli.tag = a; closeModal(); if (U.view !== 'clientes') go('clientes'); else render(); },
  client: a => openClient(a),
  'copy-wa': a => { const c = clientById(a); copyText(waMessage(c, clientStats(c)), 'Mensaje copiado. Pegalo en WhatsApp.'); },
  'copy-phone': a => copyText(clientById(a).phone, 'Teléfono copiado'),
  'ev-new': () => openEvent(),
  config: () => { closeModal(); openConfig(); },
  theme: () => toggleTheme(),
  more: () => openMore(),
  reset: () => openConfirm('Restablecer demo', 'Se borran los pedidos, cobros y cambios que hiciste en esta demostración y se vuelve a los datos iniciales.', 'Restablecer', () => { const cfg = Object.assign({}, S.config); seed(cfg.fixedDate || realToday(), cfg); U.sim.milk = null; return 'Demo restablecida'; }, true),
  /* formulario de pedido */
  'nf-flavor': a => { DR.b.flavor = a; DR.b.tops = []; $('#nf-builder').innerHTML = builderHtml(); },
  'nf-line': a => { DR.b.line = a; DR.b.tops = []; $('#nf-builder').innerHTML = builderHtml(); },
  'nf-parse': () => {
    const ta = $('#nf-wa'); DR.wa = ta ? ta.value : DR.wa;
    const r = parseWa(DR.wa);
    if (!r.items.length) { DR.waNote = `<span style="color:var(--bad)">No encontré productos en el mensaje. Probá con algo como «2 parfait de mango + 1 natural 660».</span>`; $('#nf-wanote').innerHTML = DR.waNote; return; }
    for (const it of r.items) { const same = DR.items.find(i => i.skuId === it.skuId && !i.toppings.length); if (same) same.qty += it.qty; else DR.items.push(it); }
    DR.waNote = `Agregué ${r.items.map(i => i.qty + ' × ' + esc(skuShort(skuById(i.skuId)))).join(', ')}.` + (r.assumed.length ? ` <span class="faint">En «${esc(r.assumed.join('», «'))}» no decía el tamaño: puse parfait 180 g.</span>` : '') + (r.unknown.length ? ` <b style="color:var(--bad)">No entendí: «${esc(r.unknown.join('», «'))}». Agregalo abajo.</b>` : ' Revisá y corregí si hace falta.');
    $('#nf-wanote').innerHTML = DR.waNote; $('#nf-builder').innerHTML = builderHtml(); $('#nf-items').innerHTML = itemsHtml(); $('#nf-total').innerHTML = totalHtml();
  },
  'nf-gift': () => { DR.gift = !DR.gift; rerenderForm(); },
  'nf-q': a => { DR.b.qty = Math.max(1, DR.b.qty + +a); $('#nf-builder').innerHTML = builderHtml(); },
  'nf-top': a => { const t = DR.b.tops; DR.b.tops = t.includes(a) ? t.filter(x => x !== a) : t.concat(a); $('#nf-builder').innerHTML = builderHtml(); },
  'nf-add': () => {
    const { sku } = builderSku();
    const key = DR.b.tops.slice().sort().join(',');
    const same = DR.items.find(i => i.skuId === sku.id && i.toppings.slice().sort().join(',') === key);
    if (same) same.qty += DR.b.qty; else DR.items.push({ skuId: sku.id, qty: DR.b.qty, toppings: DR.b.tops.slice() });
    DR.b.qty = 1; DR.b.tops = [];
    $('#nf-builder').innerHTML = builderHtml(); $('#nf-items').innerHTML = itemsHtml(); $('#nf-total').innerHTML = totalHtml();
  },
  'nf-rm': a => { DR.items.splice(+a, 1); $('#nf-builder').innerHTML = builderHtml(); $('#nf-items').innerHTML = itemsHtml(); $('#nf-total').innerHTML = totalHtml(); },
  'nf-del': a => { DR.delivery = a; if (a === 'moto') { DR.shipPaidBy = 'negocio'; DR.shipCost = 2500; } else if (a === 'uber') { DR.shipPaidBy = 'cliente'; const c = clientById(DR.clientId); DR.shipCost = c && BARRIO_UBER[c.barrio] || 3500; } rerenderForm(); },
  'nf-paidby': a => { DR.shipPaidBy = a; rerenderForm(); },
  'nf-pay': a => { DR.payMethod = a; rerenderForm(); },
};

Object.assign(ACT, GRI_ACT, TOUR_ACT, UI2_ACT, ONB_ACT);

/* ---------- Arrastrar y soltar ---------- */
const DRAG = { s: null, suppress: false };
function dragStart() {
  const d = DRAG.s; if (!d || d.started) return;
  d.started = true;
  const r = d.card.getBoundingClientRect();
  d.ox = d.x - r.left; d.oy = d.y - r.top;
  d.ghost = d.card.cloneNode(true); d.ghost.classList.add('drag-ghost'); d.ghost.style.width = r.width + 'px';
  d.ghost.style.left = r.left + 'px'; d.ghost.style.top = r.top + 'px';
  document.body.appendChild(d.ghost); d.card.classList.add('drag-src');
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) { }
}
function dropTarget(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest('[data-drop]'); }
document.addEventListener('pointerdown', e => {
  const card = e.target.closest('[data-drag]');
  if (!card || e.target.closest('button,a,input,select') || e.button > 0) return;
  DRAG.s = { card, id: card.dataset.drag, x: e.clientX, y: e.clientY, touch: e.pointerType !== 'mouse', started: false };
  if (DRAG.s.touch) DRAG.s.timer = setTimeout(dragStart, 380);
});
document.addEventListener('pointermove', e => {
  const d = DRAG.s; if (!d) return;
  const dist = Math.hypot(e.clientX - d.x, e.clientY - d.y);
  if (!d.started) { if (d.touch) { if (dist > 8) { clearTimeout(d.timer); DRAG.s = null; } return; } if (dist > 6) dragStart(); else return; }
  d.ghost.style.left = (e.clientX - d.ox) + 'px'; d.ghost.style.top = (e.clientY - d.oy) + 'px';
  document.querySelectorAll('.drop-on').forEach(x => x.classList.remove('drop-on'));
  const t = dropTarget(e.clientX, e.clientY); if (t) t.classList.add('drop-on');
});
document.addEventListener('touchmove', e => { if (DRAG.s && DRAG.s.started) e.preventDefault(); }, { passive: false });
function endDrag(e, cancel) {
  const d = DRAG.s; if (!d) return; clearTimeout(d.timer); DRAG.s = null;
  if (!d.started) return;
  const t = !cancel && dropTarget(e.clientX, e.clientY);
  d.ghost.remove(); d.card.classList.remove('drag-src');
  document.querySelectorAll('.drop-on').forEach(x => x.classList.remove('drop-on'));
  DRAG.suppress = true; setTimeout(() => DRAG.suppress = false, 60);
  if (t) { const to = t.dataset.drop; if (orderById(d.id).status !== to) { if (to === 'entregado' && orderById(d.id).ship && orderById(d.id).ship.status !== 'en_camino') { toast('Los envíos se marcan entregados desde Envíos, después del retiro del conductor.', 'err'); return; } run(() => A.moveOrder(d.id, to)); } }
}
document.addEventListener('pointerup', e => endDrag(e));
document.addEventListener('pointercancel', e => endDrag(e, true));
document.addEventListener('contextmenu', e => { if (DRAG.s && DRAG.s.touch) e.preventDefault(); });

/* ---------- Eventos globales ---------- */
document.addEventListener('click', e => {
  if (DRAG.suppress) { e.preventDefault(); e.stopPropagation(); return; }
  if (e.target.closest('.qhelp, .how')) return;
  const ov = e.target.closest('[data-overlay]');
  if (ov && e.target === ov) { closeModal(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A' && el.dataset.act !== 'uber' && el.dataset.act !== 'close') e.preventDefault();
  fn(el.dataset.arg, el, e);
}, true);
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'gri-form') { const i = $('#gri-in'); griAsk(i.value); return; } if (M.submit) M.submit(); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.closest('#mform')) { if (M.onInput) M.onInput(el); return; }
  if (el.closest('#gri-panel')) return;
  const k = el.dataset.input; if (!k) return;
  if (k === 'ped-q') U.ped.q = el.value;
  else if (k === 'cli-q') U.cli.q = el.value;
  else if (k === 'sim-milk') U.sim.milk = Math.max(1, Math.round(+el.value || 0));
  else if (k === 'est-packs') U.est.packs = +el.value;
  else if (k === 'est-disc') U.est.disc = +el.value;
  render();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.closest('#mform')) { if (M.onInput && el.tagName === 'SELECT') M.onInput(el); return; }
  const k = el.dataset.change; if (!k) return;
  if (k === 'ped-state') U.ped.state = el.value;
  else if (k === 'env-day') U.env.date = el.value || 'hoy';
  else if (k === 'mv-f') U.inv.mv = el.value;
  else if (k === 'ven-from') U.ven.from = el.value;
  else if (k === 'ven-to') U.ven.to = el.value;
  render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#overlay-root').innerHTML) closeModal();
  else if (e.key === 'Escape' && U.gri.open) ACT['gri-close']();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('.ocard')) openOrder(e.target.dataset.arg);
});
/* Tooltips de gráficos */
const tip = () => $('#tip');
document.addEventListener('pointerover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el) { tip().classList.remove('on'); return; }
  const r = el.getBoundingClientRect();
  tip().textContent = el.dataset.tip;
  tip().style.left = clamp(r.left + r.width / 2, 90, innerWidth - 90) + 'px'; tip().style.top = r.top + 'px';
  tip().classList.add('on');
});
document.addEventListener('scroll', () => tip().classList.remove('on'), true);

window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v]) { U.view = v; closeModal(); render(); scrollTo(0, 0); } });

/* ---------- Arranque ---------- */
(function boot() {
  try { document.documentElement.classList.toggle('dark', localStorage.getItem('lg-theme') === 'dark'); } catch (e) { }
  const saved = loadState();
  if (saved && (saved.config.fixedDate || saved.demoDate === realToday())) { S = saved; S.ideas = S.ideas || {}; S.flavors = S.flavors || {}; S.onboard = S.onboard || { products: true, stock: false, clients: false, order: false }; Object.assign(FLAVORS, S.flavors); S.subs = S.subs || []; ensureSubOrders(); LOG_RES = false; rebalance(); LOG_RES = true; }
  else seed(saved && saved.config.fixedDate ? saved.config.fixedDate : realToday(), saved ? saved.config : null);
  persist();
  const v = location.hash.slice(1); if (VIEWS[v]) U.view = v;
  else if (!tourSeen()) { markSeen(); U.view = 'bienvenida'; }
  render();
  griRenderPanel();
})();

</script>

</body>
</html>
