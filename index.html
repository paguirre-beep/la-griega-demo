/* Layout: barra lateral fija + lienzo de tarjetas en escritorio; barra superior, navegación inferior y hojas modales en celular.
   Identidad: La Griega — naranja de marca, tipografía redondeada tipo Cooper (Fraunces "SOFT"), fondos crema cálidos. */
:root{
  --bg:#FFF6EF; --surface:#FFFFFF; --surface-2:#FCEEE4; --surface-3:#F6E0D1;
  --line:#F1DCCD; --line-2:#E7C7B2;
  --ink:#2A170E; --ink-2:#6C4E3F; --ink-3:#9C8173;
  --brand:#F94901; --primary:#E24300; --primary-hover:#C93B00; --on-primary:#FFFFFF;
  --sage:#FF7A3A; --sage-2:#FFC2A1; --sage-soft:#FFE7D8; --sage-ink:#A33100;
  --terra:#7E3416; --terra-soft:#F4E2D7; --terra-ink:#6E2C11;
  --good:#2F7A45; --good-soft:#DCEEDF;
  --warn:#A3680A; --warn-soft:#F8E8C4;
  --bad:#B42F2A; --bad-soft:#F8D9D5;
  --info:#2F6488; --info-soft:#DCE8F1;
  --yog:#FFFBF4; --glass:#F6E6DA; --glass-line:#E3C3AD;
  --shadow:0 1px 2px rgba(80,30,5,.05),0 10px 28px -16px rgba(80,30,5,.18);
  --shadow-lg:0 24px 60px -20px rgba(40,15,0,.35);
  --f-display:'Fraunces','Cooper Black','Cooper Std',Georgia,serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:18px; --r:13px; --r-sm:9px;
  color-scheme:light;
}
:root.dark{
  --bg:#170F0B; --surface:#211612; --surface-2:#2B1D17; --surface-3:#37261E;
  --line:#3A2820; --line-2:#4C352A;
  --ink:#F8ECE3; --ink-2:#D0B7A8; --ink-3:#9D8275;
  --brand:#F94901; --primary:#FF6024; --primary-hover:#FF7A45; --on-primary:#1A0800;
  --sage:#FF7A3A; --sage-2:#7D3519; --sage-soft:#3B1D10; --sage-ink:#FFB48C;
  --terra:#E9A07A; --terra-soft:#3A2419; --terra-ink:#F3C2A5;
  --good:#7CC48E; --good-soft:#1C3122;
  --warn:#E5B05A; --warn-soft:#382A12;
  --bad:#F28A80; --bad-soft:#3F1D1A;
  --info:#8DB8D6; --info-soft:#1B2A36;
  --yog:#FBF1E6; --glass:#3A2A22; --glass-line:#5A4134;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -16px rgba(0,0,0,.55);
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--terra);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.serif{font-family:var(--f-display);font-weight:400;letter-spacing:-.01em}

/* ---------- Estructura ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 14px 16px;border-right:1px solid var(--line);background:var(--surface-2);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--f-display);font-size:22px;line-height:1;letter-spacing:-.01em}
.brand-tag{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:11px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px}
.nav a:hover{background:var(--surface-3);color:var(--ink)}
.nav a.on{background:var(--sage-soft);color:var(--sage-ink)}
.nav .badge{margin-left:auto}
.side-cta{margin:12px 0 4px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px}
.user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:13px;background:var(--surface);border:1px solid var(--line)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.user b{display:block;font-size:13.5px}
.user small{color:var(--ink-3);font-size:12px}
.side-tools{display:flex;gap:6px}
.side-tools .btn{flex:1}
.main{min-width:0;padding:28px 34px 60px;padding-left:max(34px,env(safe-area-inset-left,0px));padding-right:max(34px,env(safe-area-inset-right,0px))}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar,.bottomnav,.fab{display:none}

.demo-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:5px 10px;border-radius:99px;background:var(--terra-soft);color:var(--terra-ink);white-space:nowrap}
.demo-pill i{width:7px;height:7px;border-radius:50%;background:var(--terra);display:block}

/* ---------- Encabezados ---------- */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.05;margin:0;letter-spacing:-.015em;text-wrap:balance}
.page-head p{margin:6px 0 0;color:var(--ink-2)}
.head-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-title h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;letter-spacing:-.01em}
.sec-title .link{font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:2px}
.sec-title .link:hover{color:var(--ink)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- Tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px;min-width:0}
.card.flat{box-shadow:none}
.card.tight{padding:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-kpi{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-kpi6{grid-template-columns:repeat(6,minmax(0,1fr))}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.kpi .k-top{display:flex;align-items:center;gap:10px}
.k-ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--sage-soft);color:var(--sage-ink)}
.k-ico.terra{background:var(--terra-soft);color:var(--terra-ink)}
.k-ico.warn{background:var(--warn-soft);color:var(--warn)}
.k-ico.bad{background:var(--bad-soft);color:var(--bad)}
.k-ico.info{background:var(--info-soft);color:var(--info)}
.k-label{font-size:13px;font-weight:600;color:var(--ink-2)}
.k-val{font-family:var(--f-display);font-size:31px;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.k-val.sm{font-size:26px}
.k-sub{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:2px;font-weight:700;font-size:12px}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)} .delta.flat{color:var(--ink-3)}
.kpi.click{cursor:pointer;transition:border-color .15s,transform .15s}
.kpi.click:hover{border-color:var(--line-2)}

/* Hero dashboard */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:10px;padding:24px 26px;background:linear-gradient(120deg,var(--surface) 30%,var(--sage-soft))}
.hero .k-val{font-size:54px}
.hero-art{align-self:end;justify-self:end;width:100%;max-width:340px;margin:-8px -6px -24px 0}
.hero-art svg{width:100%;height:auto;display:block}
.hero-stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:6px}
.hero-stats div{display:flex;flex-direction:column}
.hero-stats b{font-family:var(--f-display);font-weight:400;font-size:22px}
.hero-stats span{font-size:12.5px;color:var(--ink-3)}
.hero-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:11px;font-weight:700;font-size:13.5px;white-space:nowrap;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.terra{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.soft{background:var(--sage-soft);border-color:transparent;color:var(--sage-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:9px;gap:5px}
.btn.lg{height:46px;padding:0 20px;font-size:14.5px;border-radius:13px}
.btn.block{width:100%}
.btn.icon{width:38px;padding:0}
.btn.icon.sm{width:32px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- Chips y badges ---------- */
.badge{min-width:22px;height:20px;padding:0 7px;border-radius:99px;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;background:var(--sage-2);color:var(--sage-ink);font-variant-numeric:tabular-nums}
.badge.terra{background:var(--terra);color:#fff}
.badge.bad{background:var(--bad);color:#fff}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.terra{background:var(--terra-soft);color:var(--terra-ink)}
.chip.sage{background:var(--sage-soft);color:var(--sage-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* Segmented / tabs */
.seg{display:inline-flex;gap:3px;padding:4px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{height:32px;padding:0 13px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;height:40px;padding:0 12px 0 38px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
textarea.input{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.input:focus{outline:2px solid var(--sage);outline-offset:0;border-color:var(--sage)}
.frow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.frow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form{display:flex;flex-direction:column;gap:14px}
.hint{font-size:12px;color:var(--ink-3)}
.opt-grid{display:flex;flex-wrap:wrap;gap:6px}
.opt{height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.opt.on{border-color:var(--primary);background:var(--sage-soft);color:var(--sage-ink)}
.opt[disabled]{opacity:.4}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:11px;overflow:hidden;height:40px;background:var(--surface)}
.stepper button{width:38px;height:100%;font-size:18px;font-weight:700}
.stepper input{width:48px;height:100%;border:0;text-align:center;font-weight:700;background:transparent}

/* ---------- Listas ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0}
.row.click{cursor:pointer}
.row.click:hover .row-title{text-decoration:underline;text-underline-offset:3px}
.row-main{flex:1;min-width:0}
.row-title{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere}
.row-end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row-end b{font-variant-numeric:tabular-nums}
.time-tag{flex:none;width:58px;text-align:center;font-weight:700;font-size:13px;padding:6px 0;border-radius:9px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.empty{padding:22px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:13px;font-size:13.5px}

/* Barras de progreso */
.prog{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--sage)}
.prog.terra i{background:var(--terra)} .prog.good i{background:var(--good)} .prog.bad i{background:var(--bad)} .prog.warn i{background:var(--warn)}

/* Alertas */
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0;padding-top:2px}
.alert .a-ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.alert.warn .a-ico{background:var(--warn-soft);color:var(--warn)}
.alert.bad .a-ico{background:var(--bad-soft);color:var(--bad)}
.alert.info .a-ico{background:var(--info-soft);color:var(--info)}
.alert.good .a-ico{background:var(--sage-soft);color:var(--sage-ink)}
.alert b{display:block;font-size:13.5px}
.alert span{font-size:12.5px;color:var(--ink-3)}
.alert .btn{margin-left:auto;flex:none}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.kanban.single{grid-template-columns:minmax(0,1fr)}
.kanban.single .col-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.col{border-radius:var(--r-lg);background:var(--surface-2);border:1px solid var(--line);padding:12px;min-width:0;transition:background .15s,border-color .15s}
.col.drop-on{background:var(--sage-soft);border-color:var(--sage)}
.col-head{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.col-head b{font-size:14.5px}
.col-head .count{margin-left:auto}
.col-head .cdot{width:9px;height:9px;border-radius:50%}
.col-body{display:flex;flex-direction:column;gap:10px;min-height:60px}
.col-sum{font-size:12px;color:var(--ink-2);background:var(--surface);border-radius:10px;padding:8px 10px;line-height:1.5}
.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;gap:9px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:box-shadow .15s,border-color .15s}
.ocard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.ocard.alertline{box-shadow:inset 3px 0 0 var(--terra)}
.ocard.drag-src{opacity:.35}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;transform:rotate(2deg);box-shadow:var(--shadow-lg);opacity:.95}
.oc-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.oc-num{font-weight:700;font-size:13px;color:var(--ink-3)}
.oc-name{font-weight:700;font-size:15px}
.oc-total{font-weight:700;font-variant-numeric:tabular-nums}
.oc-items{font-size:13px;line-height:1.55}
.oc-items b{font-variant-numeric:tabular-nums}
.oc-meta{font-size:12px;color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.oc-meta span{display:inline-flex;align-items:center;gap:4px}
.oc-note{font-size:12px;color:var(--ink-2);background:var(--surface-2);padding:6px 9px;border-radius:8px}
.oc-actions{display:flex;gap:6px;align-items:center}
.oc-actions .btn:last-child{margin-left:auto}
.col-tabs{display:none}

/* ---------- Envíos ---------- */
.ship{display:grid;grid-template-columns:76px minmax(0,1fr);gap:16px;padding:18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.ship.done{opacity:.72}
.ship-time{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:2px}
.ship-time b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1}
.ship-time span{font-size:11.5px;color:var(--ink-3)}
.ship-body{min-width:0;display:flex;flex-direction:column;gap:10px}
.ship-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ship-head h3{margin:0;font-size:17px;font-weight:700}
.ship-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;font-size:13px}
.ship-grid dt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.ship-grid dd{margin:0;overflow-wrap:anywhere}
.ship-states{display:flex;gap:8px;flex-wrap:wrap}
.state{display:flex;flex-direction:column;gap:3px;padding:7px 10px;border-radius:10px;background:var(--surface-2);min-width:130px}
.state small{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ship-actions{display:flex;gap:6px;flex-wrap:wrap}
.incident{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:600;flex-wrap:wrap}
.incident .btn{margin-left:auto}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font-size:11px;font-family:var(--f-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--sage-2);transition:fill .15s;cursor:pointer}
.chart .bar.hi{fill:var(--primary)}
.chart .bar.today{fill:var(--terra)}
.chart .bar:hover,.chart .bar.on{fill:var(--sage-ink)}
.chart .vlabel{fill:var(--ink);font-weight:700}
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px;align-items:center}
.hbar .lbl{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.hbar .val small{color:var(--ink-3);font-weight:600;margin-left:6px}
.hbar .track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:99px;background:var(--sage)}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 12px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.tip{position:fixed;z-index:300;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;padding:7px 10px;border-radius:9px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .1s}
.tip.on{opacity:1}

/* ---------- Producción ---------- */
.plan{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.plan:first-child{border-top:0}
.plan-nums{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:4px}
.plan-nums b{color:var(--ink);font-variant-numeric:tabular-nums}
.need{font-family:var(--f-display);font-size:30px;line-height:1;text-align:right}
.need small{display:block;font-family:var(--f-body);font-size:11.5px;color:var(--ink-3);margin-top:3px}
.stages{display:flex;align-items:center;gap:0;margin:6px 0 2px}
.stage{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);flex:1;position:relative;text-align:center}
.stage i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;z-index:1}
.stage.done i{background:var(--primary);border-color:var(--primary)}
.stage.cur i{border-color:var(--terra);box-shadow:0 0 0 4px var(--terra-soft)}
.stage.done{color:var(--ink-2)} .stage.cur{color:var(--terra-ink);font-weight:700}
.stage:not(:last-child)::after{content:"";position:absolute;top:9px;left:50%;width:100%;height:2px;background:var(--line-2)}
.stage.done:not(:last-child)::after{background:var(--primary)}
.cost-split{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:8px 0}
.cost-split i{display:block;height:100%}

/* Inventario */
.lot-table{width:100%;border-collapse:collapse;font-size:13px}
.lot-table th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:left;font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line)}
.lot-table td{padding:10px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lot-table tr:last-child td{border-bottom:0}
.lot-table td.r,.lot-table th.r{text-align:right}
.tbl-wrap{overflow-x:auto}
.sku-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sku-nums{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.sku-nums div{display:flex;flex-direction:column;align-items:flex-end}
.sku-nums b{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.sku-nums span{font-size:11.5px;color:var(--ink-3)}

/* Clientes */
.cl-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;background:var(--sage-soft);color:var(--sage-ink)}
.cl-av.biz{background:var(--terra-soft);color:var(--terra-ink);border-radius:12px}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.suggest{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--sage-soft);color:var(--sage-ink)}
.suggest p{margin:0;font-size:13.5px}
.msg-box{background:var(--surface-2);border-radius:12px;padding:12px;font-size:13px;white-space:pre-wrap;color:var(--ink)}

/* Estrategia */
.insight{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.insight:first-child{border-top:0;padding-top:0}
.insight .tag{flex:none;margin-top:1px}
.insight b{display:block;font-size:14px;margin-bottom:2px}
.insight p{margin:0;font-size:13px;color:var(--ink-2)}
.cal-ev{padding:14px 0;border-top:1px solid var(--line)}
.cal-ev:first-child{border-top:0;padding-top:0}
.cal-steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cal-steps span{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.cal-steps span.past{text-decoration:line-through;opacity:.55}
.cal-steps span.now{background:var(--terra-soft);color:var(--terra-ink);font-weight:700}
.range{width:100%;accent-color:var(--primary)}
.scenario-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}

/* ---------- Modal / hoja ---------- */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(24,26,20,.45);display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s ease}
.modal{width:100%;max-width:560px;max-height:calc(100vh - 48px);overflow-y:auto;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;animation:pop .18s ease}
.modal.wide{max-width:820px}
.drawer-o{justify-content:flex-end;padding:0}
.drawer-o .modal{height:100%;max-height:100%;border-radius:22px 0 0 22px;max-width:520px;animation:slide .2s ease}
.m-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.m-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.1}
.m-head p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.m-body{padding:18px 22px;display:flex;flex-direction:column;gap:16px}
.m-foot{position:sticky;bottom:0;background:var(--surface);display:flex;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
.m-foot .grow{margin-right:auto}
.total-box{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:14px;padding:14px 16px;font-size:13.5px}
.total-box div{display:flex;justify-content:space-between;gap:10px}
.total-box .big{font-size:20px;font-weight:700;padding-top:6px;border-top:1px solid var(--line-2)}
.line-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.line-item .row-main{font-size:13.5px}
.builder{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.timeline{display:flex;flex-direction:column;gap:10px;font-size:13px}
.timeline div{display:flex;gap:10px}
.timeline time{color:var(--ink-3);flex:none;width:92px;font-variant-numeric:tabular-nums}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}

/* Toasts */

.toast.err{background:var(--bad);color:#fff}
.toast .ico{margin-top:1px}

/* ---------- Marca La Griega ---------- */
.page-head h1,.sec-title h2,.k-val,.m-head h2,.brand-name,.hero-stats b,.ship-time b,.need,.sku-nums b,.serif{font-weight:700;letter-spacing:-.02em}

.sec-title h2,.m-head h2{font-weight:700}
.brand-logo{display:flex;align-items:center;justify-content:center;background:var(--brand);border-radius:14px;padding:12px 14px}
.brand-logo img{display:block;width:100%;max-width:150px;height:auto}
.side .brand{flex-direction:column;align-items:stretch;gap:8px;padding:0 0 14px}
.side .brand .brand-tag{text-align:center;margin:0}
.topbar .brand-logo{padding:6px 10px;border-radius:10px}

.hero{background:var(--brand);color:#fff;border-color:transparent;
  --sage:#FFFFFF;--sage-2:rgba(255,255,255,.35);--sage-ink:#FFFFFF;--glass:rgba(255,255,255,.28);--glass-line:rgba(255,255,255,.6);--yog:#FFF8EE}
.hero .eyebrow,.hero .k-sub,.hero .hero-stats span,.hero .delta{color:rgba(255,255,255,.88)}

.hero .btn.primary:hover{background:#FFE7D8}
.hero .btn:not(.primary){background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.hero .btn:not(.primary):hover{background:rgba(255,255,255,.12)}
.nav a.on{background:var(--sage-soft);color:var(--sage-ink)}

/* ---------- Gri ---------- */
.g-welcome{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:stretch}

.gri-av.lg{width:46px;height:46px;font-size:26px}
.gri-av.sm{width:28px;height:28px;font-size:16px;box-shadow:none}

.gw-head{display:flex;align-items:center;gap:12px}

.gw-acts{margin-top:4px}
.hero.hero-c{display:flex;flex-direction:column;gap:6px;padding:22px 24px}
.hero-c .k-val{font-size:46px}
.hero-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25)}

.hero-c .hero-actions{margin-top:auto;padding-top:12px}
.recs{display:flex;flex-direction:column;gap:10px}

.rec-bad{--rc:var(--bad)} .rec-warn{--rc:var(--warn)} .rec-good{--rc:var(--good)} .rec-info{--rc:var(--info)}
.rec-ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface);color:var(--rc)}
.rec-body{min-width:0;display:flex;flex-direction:column;gap:6px}
.rec-level{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}
.rec p{margin:0;font-size:14px;line-height:1.5}
.rec-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}

.gri-fab{position:fixed;right:max(22px,env(safe-area-inset-right,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:center;gap:9px;height:50px;padding:0 18px 0 10px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;box-shadow:var(--shadow-lg)}

.gri-panel{position:fixed;top:0;right:0;bottom:0;z-index:95;width:min(420px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .2s ease}
.gp-head{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}

.gp-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}

.gp-form{display:flex;gap:8px;padding:10px 16px 6px;border-top:1px solid var(--line)}
.gp-note{margin:0;padding:0 16px 12px;font-size:11px;color:var(--ink-3)}
@media (max-width:1280px){.g-welcome{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
@media (max-width:1100px){.g-welcome{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1023px){
  .gri-fab{bottom:calc(86px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));height:46px;padding:0 15px 0 8px;font-size:13px}

/* ---------- Bienvenida y recorrido ---------- */
.welcome{gap:14px;padding:28px 28px 8px}
.w-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.w-list{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:w}
.w-list li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:2px 12px;font-size:14px;line-height:1.5;counter-increment:w}
.w-list li::before{content:counter(w);grid-row:1/3;width:30px;height:30px;border-radius:9px;background:var(--sage-soft);color:var(--sage-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.w-list b{display:block}
.w-list span{color:var(--ink-2)}
.w-foot{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:0;padding:16px 28px 26px}
#tour{position:fixed;inset:0;z-index:500;pointer-events:none}
.t-block{position:fixed;inset:0;pointer-events:auto}
.t-spot{position:fixed;border:2px solid var(--brand);box-shadow:0 0 0 9999px rgba(30,16,8,.55);transition:all .25s ease;pointer-events:none}
.t-pop{position:fixed;width:min(340px,calc(100vw - 24px));background:var(--surface);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow-lg);pointer-events:auto;display:flex;flex-direction:column;gap:6px;animation:pop .2s ease}
.t-pop h3{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15}
.t-pop p{margin:0;font-size:14px;line-height:1.55;color:var(--ink-2)}
.t-pop p b{color:var(--ink)}
.t-foot{display:flex;align-items:center;gap:6px;margin-top:10px}
.t-dots{display:flex;gap:4px;margin-right:auto;flex-wrap:wrap;max-width:120px}
.t-dots i{width:6px;height:6px;border-radius:99px;background:var(--line-2);display:block}
.t-dots i.done{background:var(--sage-2)}
.t-dots i.on{width:16px;background:var(--brand)}
.t-pop.sheet{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom,0px));width:auto}
.t-pop.sheet.top{bottom:auto;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:760px){.w-title{font-size:26px}.welcome{padding:22px 20px 6px}.w-foot{grid-template-columns:1fr;padding:14px 20px 22px}.w-foot .btn.primary{order:-1}}

/* =====================================================================
   v2 — colores funcionales, Gri, Envíos, Producción, Inventario, Cobrar, Primeros pasos
   ===================================================================== */
:root{
  --t-orange:#FFE0CC; --t-orange-i:#C93B00;
  --t-sage:#E4EDDC; --t-sage-i:#4B6B3C;
  --t-green:#E6F2E1; --t-green-i:#2F7A45;
  --t-blue:#E1EDFA; --t-blue-i:#2F6488; --t-blue-line:#C9DDF2;
  --t-amber:#FCEFD0; --t-amber-i:#A3680A;
  --t-red:#FBE2DE; --t-red-i:#B42F2A;
  --t-cream:#FBF4EC; --t-cream-i:#7E3416;
}
:root.dark{
  --t-orange:#3D2112; --t-orange-i:#FF9A66;
  --t-sage:#25301E; --t-sage-i:#B5CDA2;
  --t-green:#1E2E20; --t-green-i:#8CCB9B;
  --t-blue:#1A2733; --t-blue-i:#9CC3E2; --t-blue-line:#2A3F52;
  --t-amber:#352914; --t-amber-i:#E8B964;
  --t-red:#3A1E1B; --t-red-i:#F2988E;
  --t-cream:#2A1E18; --t-cream-i:#F0C3A6;
}
.kpi{position:relative}
.kpi.bg-orange{background:var(--t-orange);border-color:transparent}.kpi.bg-orange .k-ico{background:var(--surface);color:var(--t-orange-i)}
.kpi.bg-sage{background:var(--t-sage);border-color:transparent}.kpi.bg-sage .k-ico{background:var(--surface);color:var(--t-sage-i)}
.kpi.bg-green{background:var(--t-green);border-color:transparent}.kpi.bg-green .k-ico{background:var(--surface);color:var(--t-green-i)}
.kpi.bg-blue{background:var(--t-blue);border-color:transparent}.kpi.bg-blue .k-ico{background:var(--surface);color:var(--t-blue-i)}
.kpi.bg-amber{background:var(--t-amber);border-color:transparent}.kpi.bg-amber .k-ico{background:var(--surface);color:var(--t-amber-i)}
.kpi.bg-red{background:var(--t-red);border-color:transparent}.kpi.bg-red .k-ico{background:var(--surface);color:var(--t-red-i)}
.kpi.bg-cream{background:var(--t-cream)}.kpi.bg-cream .k-ico{background:var(--surface);color:var(--t-cream-i)}
.kpi[class*="bg-"] .k-sub{color:var(--ink-2)}
.g-kpi5{grid-template-columns:repeat(5,minmax(0,1fr))}
.bg-orange{background:var(--t-orange);color:var(--t-orange-i)} .bg-sage{background:var(--t-sage);color:var(--t-sage-i)} .bg-blue{background:var(--t-blue);color:var(--t-blue-i)}

/* Atención */
.att-list{display:flex;flex-direction:column}

.lv-red .att-ico{background:var(--t-red);color:var(--t-red-i)} .lv-amber .att-ico{background:var(--t-amber);color:var(--t-amber-i)} .lv-green .att-ico{background:var(--t-green);color:var(--t-green-i)} .lv-blue .att-ico{background:var(--t-blue);color:var(--t-blue-i)}
.att-main{min-width:0}

.lvl{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.lvl-red{background:var(--t-red);color:var(--t-red-i)} .lvl-amber{background:var(--t-amber);color:var(--t-amber-i)} .lvl-green{background:var(--t-green);color:var(--t-green-i)} .lvl-blue{background:var(--t-blue);color:var(--t-blue-i)}
.sec-title .link{background:none;border:0;cursor:pointer}

/* Próximos envíos (azul) */

.ship-rows{display:flex;flex-direction:column}
.ship-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto 16px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.ship-row:first-child{border-top:0}
.ship-row:hover .sr-main b{text-decoration:underline;text-underline-offset:3px}
.sr-time{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:10px;background:var(--t-blue);color:var(--t-blue-i)}
.sr-main{min-width:0;display:flex;flex-direction:column}
.sr-main b{font-size:14px}
.sr-main small{color:var(--ink-3);font-size:12px}
.sr-chev{color:var(--ink-3)}

/* Píldoras de estado */
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 11px;border-radius:10px;font-size:12.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);line-height:1.25}
.p-green{background:var(--t-green);color:var(--t-green-i)} .p-amber{background:var(--t-amber);color:var(--t-amber-i)} .p-red{background:var(--t-red);color:var(--t-red-i)}
.p-blue{background:var(--t-blue);color:var(--t-blue-i)} .p-blue-l{background:var(--t-blue);color:var(--t-blue-i);opacity:.85} .p-terra{background:var(--t-orange);color:var(--t-orange-i)}

/* Envíos */
.big-h2{font-size:28px!important}
.big-h2 i{font-style:italic;color:var(--t-blue-i)}
.ship2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr) minmax(190px,.9fr);gap:0;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;position:relative}
.ship2::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--sc)}
.st-orange{--sc:var(--brand)} .st-blue{--sc:var(--t-blue-i)} .st-green{--sc:var(--good)} .st-red{--sc:var(--bad)} .st-grey{--sc:var(--line-2)}
.ship2 > div{padding:16px 18px;min-width:0}
.ship2 > div + div{border-left:1px solid var(--line)}
.s-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.s-name h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px}
.s-line{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-top:6px;color:var(--ink)}
.s-line .ico{margin-top:2px;color:var(--ink-3)}
.s-lbl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.s-item{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:6px 8px;border-radius:10px;background:var(--surface-2);margin-top:6px}
.s-states{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.s-acts{display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.s-sec{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.s-sec .btn{justify-content:flex-start}
.btn.ok{background:var(--t-green);border-color:var(--good);color:var(--t-green-i)}
.trip{display:flex;gap:8px;padding:10px;border-radius:12px;background:var(--t-blue);color:var(--t-blue-i);font-size:12.5px}
.trip b{display:block;font-size:13.5px}
.trip span{display:block;color:var(--ink-2)}
.note-box{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface-2)}
.note-box p{margin:0;font-size:13px;color:var(--ink-2)}

/* Producción */
.need-card{display:flex;flex-direction:column;gap:12px;padding:0;overflow:hidden}
.need-card > *:not(.nc-head){margin:0 20px}
.need-card > *:last-child{margin-bottom:20px}
.nc-head{display:flex;gap:14px;align-items:center;padding:18px 20px}
.nc-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px}
.nc-head p{margin:2px 0 0;font-size:13px;color:var(--ink-2)}
.nc-orange{background:var(--t-orange)} .nc-cream{background:var(--surface-2)}
.nc-ico{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);flex:none}
.nc-orange .nc-ico{color:var(--t-orange-i)}
.ptable{display:flex;flex-direction:column}
.pt-h,.pt-r{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(4,minmax(0,1fr));gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.pt3 .pt-h,.pt3 .pt-r{grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,1fr))}
.pt-h{font-size:11.5px;font-weight:700;color:var(--ink-3);padding-top:0}
.pt-h span:not(:first-child),.pt-r span:not(:first-child){text-align:center}
.pt-r{font-size:16px;font-variant-numeric:tabular-nums}
.pt-name{display:flex;gap:8px;align-items:center;font-size:14px;min-width:0}
.hl{font-style:normal;font-weight:700;display:inline-block;min-width:44px;padding:5px 10px;border-radius:10px;background:var(--t-orange);color:var(--t-orange-i)}
.hl.soft{background:var(--surface-2);color:var(--ink)}
.nc-acts{display:flex;gap:8px;flex-wrap:wrap}

/* Inventario */
.inv-h,.inv-item summary{display:grid;grid-template-columns:minmax(0,2.2fr) repeat(3,minmax(0,.8fr)) minmax(0,1fr) 18px;gap:10px;align-items:center}
.inv-h{font-size:11.5px;font-weight:700;color:var(--ink-3);padding:0 6px 8px;border-bottom:1px solid var(--line)}
.inv-h span:nth-child(n+2):nth-child(-n+4),.inv-item summary > span:nth-child(n+2):nth-child(-n+4){text-align:center;font-variant-numeric:tabular-nums}
.inv-item{border-bottom:1px solid var(--line)}
.inv-item summary{list-style:none;cursor:pointer;padding:12px 6px;font-size:15px}
.inv-item summary::-webkit-details-marker{display:none}
.inv-item summary:hover{background:var(--surface-2)}
.ii-name{display:flex;gap:10px;align-items:center;min-width:0}
.ii-name small{display:block;color:var(--ink-3);font-size:12px}
.ii-chev{transition:transform .15s;color:var(--ink-3)}
.inv-item[open] .ii-chev{transform:rotate(90deg)}
.ii-lots{padding:0 6px 14px}
.mv-ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--ink-2)}
.mv-ico.t-good{background:var(--t-green);color:var(--t-green-i)} .mv-ico.t-bad{background:var(--t-red);color:var(--t-red-i)} .mv-ico.t-info{background:var(--t-blue);color:var(--t-blue-i)}

/* Cobrar */
.pay-block{display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--pc)}
.pb-red{--pc:var(--t-red-i)} .pb-amber{--pc:var(--t-amber-i)} .pb-green{--pc:var(--t-green-i)}
.pb-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:4px}
.pb-head h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px}
.pb-head p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.pb-total{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--pc);white-space:nowrap;font-variant-numeric:tabular-nums}
.pay-row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.pay-row:first-child{border-top:0}
.pay-end{display:flex;align-items:center;gap:10px;margin-left:auto}
.amt{font-size:17px;font-variant-numeric:tabular-nums;font-weight:700}
.paid-bar{display:flex;align-items:center;gap:8px;margin-top:6px}.paid-bar .prog{width:120px}
.linklike{font-weight:700;text-align:left}
.linklike:hover{text-decoration:underline;text-underline-offset:3px}

/* Clientes */
.cli-row{flex-wrap:wrap}
.cli-acts{display:flex;gap:4px;flex:none}
.cli-stats .stat.big{background:var(--t-orange)}
.cli-stats .stat.owe{background:var(--t-amber)}
.cli-stats b{font-size:16px}
.hist{display:flex;flex-direction:column;gap:6px}
.hist-item{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);text-align:left;width:100%}
.hist-item:hover{background:var(--surface-3)}
.hist-date{display:flex;flex-direction:column;align-items:center;width:40px;flex:none;font-size:11px;color:var(--ink-3);text-transform:uppercase;font-weight:700}
.hist-date b{font-size:18px;color:var(--ink);line-height:1}
.suggest .gri-av{background:var(--surface)}

/* Estrategia */
.idea-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Primeros pasos */
.onb-hero{display:flex;align-items:center;justify-content:space-between;gap:20px}
.w-title.big{font-size:52px}
.onb-hello p{margin:6px 0 0;font-size:17px;color:var(--ink-2)}
.onb-art{width:260px;flex:none}.onb-art svg{width:100%;height:auto}
.onb-grid{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
.onb-progress{display:flex;align-items:center;gap:16px;padding:16px 20px}
.onb-progress b{font-family:var(--f-display);font-size:19px;white-space:nowrap}
.onb-progress .prog{flex:1;height:10px}
.onb-step{display:flex;align-items:center;gap:16px;padding:16px 20px}
.onb-num{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:17px;background:var(--t-orange);color:var(--t-orange-i)}
.onb-step:nth-child(4) .onb-num{background:var(--t-blue);color:var(--t-blue-i)}
.onb-step.ok .onb-num{background:var(--t-green);color:var(--t-green-i)}
.onb-txt{flex:1;min-width:0}
.onb-txt h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:20px}
.onb-txt p{margin:3px 0 0;font-size:13.5px;color:var(--ink-2)}
.onb-act{display:flex;gap:8px;align-items:center;flex:none}
.xls{display:flex;align-items:center;gap:6px;padding-left:14px;border-left:1px solid var(--line);flex:none}
.xls small{font-size:11px;color:var(--ink-3);width:54px;line-height:1.2}
.btn.terra-o{border-color:var(--primary);color:var(--primary)}
.onb-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.onb-how{display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.how-item{display:flex;gap:14px;align-items:flex-start}
.how-ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;flex:none}
.how-ico .ico{width:24px;height:24px}
.how-item b{font-family:var(--f-display);font-weight:700;font-size:19px}
.how-item p{margin:2px 0 0;font-size:13.5px;color:var(--ink-2)}
.excel-note{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface-2)}

.onb-mascot{align-self:center}

/* Importación */
.imp-cols{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--surface-2)}
.imp-cols .btn{align-self:flex-start}
.drop{display:block;border:2px dashed var(--line-2);border-radius:14px;padding:18px;text-align:center;cursor:pointer}
.drop:hover{border-color:var(--primary)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop span{display:flex;flex-direction:column;align-items:center;gap:4px}

.ip-row{display:grid;grid-template-columns:58px minmax(0,1fr) minmax(0,1.3fr);gap:10px;padding:8px 10px;border-radius:10px;font-size:13px;background:var(--surface-2)}
.ip-line{color:var(--ink-3);font-size:12px}

.ip-msg{color:var(--ink-2)}
.ip-nuevo{background:var(--t-green)} .ip-error{background:var(--t-red)} .ip-error .ip-msg{color:var(--t-red-i);font-weight:700} .ip-existe{background:var(--t-blue)}
.checkline{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600}
.chart text{font-size:12.5px;font-weight:600}

/* =====================================================================
   Tipografía global: Manrope (embebida, con alternativas del sistema).
   Títulos 700 · tarjetas y secciones 600 · cifras 700 tabulares · botones 600 · menú 500 · texto 400.
   El logo es una imagen y la mascota conserva su propia letra.
   ===================================================================== */
:root{--f-display:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
body{font-weight:400;line-height:1.5;font-feature-settings:"ss01" 0}
h1,h2,h3{font-family:var(--f-display)}
.page-head h1,.gw-title,.w-title,.home .gri-hello .gw-title{font-weight:700;letter-spacing:-.025em;line-height:1.12}
.page-head h1{font-size:36px}
.home .gri-hello .gw-title{font-size:38px}
.sec-title h2,.m-head h2,.nc-head h2,.pb-head h2,.s-name h3,.onb-txt h3,.how-item b,.t-pop h3,.gp-head b,.gb-name,.big-h2,.onb-progress b,.w-title.big + p{font-weight:600;letter-spacing:-.015em}
.sec-title h2{font-size:21px}
.home .sec-title h2{font-size:23px}
.m-head h2{font-size:23px}
.big-h2{font-size:25px!important}
.k-val,.home-kpis .k-val,.need,.sku-nums b,.pb-total,.hero-mini b,.ship-time b,.amt,.hl,.oc-total,.stat b,.hist-date b,.gp-head b{font-variant-numeric:tabular-nums}
.k-val,.home-kpis .k-val,.need,.sku-nums b,.pb-total,.hero-mini b,.ship-time b,.amt,.hl,.oc-total{font-weight:700;letter-spacing:-.025em;white-space:nowrap}
.k-val{font-size:30px;line-height:1.1}
.k-val.sm{font-size:25px}
.home-kpis .k-val{font-size:34px}
.btn,.seg button,.opt,.chip-btn,.rest-toggle,.linklike,.sec-title .link{font-weight:600}
.nav a{font-weight:500}
.nav a.on{font-weight:600}
.k-label,.row-sub,.hint,.k-sub,.att-main span,.oc-meta,.s-line,.gw-text,.gri-banner p,.how-item p,.onb-txt p{font-weight:400}
.k-label{font-size:13.5px;color:var(--ink-2)}
.eyebrow{font-weight:600}
.row-title,.oc-name,.att-main b,.sr-main b,.ii-name b,.pt-name b{font-weight:600}
.brand-name{font-weight:700}
.sec-title{flex-wrap:wrap;row-gap:4px}
.sec-title .link{white-space:nowrap}
@media (max-width:1280px){.home-kpis .k-val{font-size:30px}}
@media (max-width:760px){
  .page-head h1{font-size:28px}
  .home .gri-hello .gw-title,.gw-title{font-size:26px}
  .home-kpis .k-val,.k-val{font-size:24px}
  .k-val.sm{font-size:21px}
  .sec-title h2,.home .sec-title h2{font-size:19px}
  .m-head h2{font-size:20px}
  .big-h2{font-size:21px!important}
  .w-title.big{font-size:30px}
}
@media (max-width:380px){.home-kpis .k-val,.k-val{font-size:21px}.k-val.sm{font-size:19px}}
/* Cifras sueltas grandes: proporcionales (se ven más compactas); en listas y tablas siguen tabulares */
.k-val,.home-kpis .k-val,.pb-total,.need,.sku-nums b,.hero-mini b,.ship-time b{font-variant-numeric:proportional-nums lining-nums}
.att-main b,.sr-main b{font-weight:600;color:var(--ink)}
.nc-head h2{font-size:21px}
@media (max-width:760px){.nc-head h2,.pb-head h2,.onb-txt h3,.how-item b{font-size:18px}.nc-head{padding:16px}.nc-ico{width:40px;height:40px}.s-name h3{font-size:19px}}

/* ---------- Pipeline de Pedidos: cada columna con el color de su estado ---------- */
.col[data-drop]{border-top:4px solid var(--cc);background:var(--cbg);border-color:transparent;border-top-color:var(--cc)}
.col[data-drop="por_elaborar"]{--cc:var(--terra);--cbg:var(--t-orange)}
.col[data-drop="en_produccion"]{--cc:var(--warn);--cbg:var(--t-amber)}
.col[data-drop="listo"]{--cc:var(--info);--cbg:var(--t-blue)}
.col[data-drop="entregado"]{--cc:var(--good);--cbg:var(--t-green)}
.col[data-drop] .col-head b{color:var(--cc)}
.col[data-drop] .col-head .count{background:var(--cc);color:#fff}
.col[data-drop] .col-sum{background:var(--surface)}
.col[data-drop] .empty{border-color:var(--cc);color:var(--ink-2);background:var(--surface)}
.col[data-drop].drop-on{outline:2px dashed var(--cc);outline-offset:3px;background:var(--cbg)}
:root.dark .col[data-drop] .col-head .count{color:var(--bg)}
/* Frascos para armar, pegar WhatsApp */
.armar{border-top:4px solid var(--brand)}
.armar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.armar-it{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.armar-it > b{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;color:var(--t-orange-i)}
.armar-it .ai-name{font-weight:600;font-size:14px}
.ai-fl{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.ai-fl span{display:inline-flex;align-items:center;gap:3px}
.armar-it.tot{background:var(--t-orange)}
.wa-box{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--t-green);border:1px dashed var(--good)}
.wa-box label{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--t-green-i)}
.wa-box textarea{min-height:58px;background:var(--surface)}

/* ---------- Canje de frascos y suscripciones ---------- */
.jar-pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 10px;border-radius:10px;background:var(--sage-soft,rgba(120,150,110,.14));color:var(--text);font-size:12.5px;font-weight:600}
.jar-hint{display:flex;align-items:center;gap:6px;align-self:end;padding-bottom:10px}
.jar-hint b{font-weight:700}
.sub-box{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.sub-box.empty-sub{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sub-box.paused{opacity:.75}
.sub-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sub-top .hint{font-weight:500;margin-left:2px}
.sub-lines{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.sub-lines>div{display:flex;gap:8px;align-items:flex-start}
.sub-lines svg{flex-shrink:0;margin-top:2px;opacity:.7}
.sub-item{grid-template-columns:1fr 160px!important}
@media (max-width:640px){.sub-item{grid-template-columns:1fr 112px!important}}

</style>
</head>

/* ---------- Costos ---------- */
function insById(id) { return S.insumos.find(i => i.id === id); }
function skuById(id) { return S.skus.find(s => s.id === id); }
function clientById(id) { return S.clients.find(c => c.id === id); }
function orderById(id) { return S.orders.find(o => o.id === id); }
function skuShort(s) { if (!s) return 'Producto'; if (s.line === 'natural') return 'Natural ' + sizeLabel(s.size); if (s.line) return LINES[s.line].name + ' ' + (FLAVORS[s.flavor] ? FLAVORS[s.flavor].name.toLowerCase() : ''); return (FLAVORS[s.flavor] || { name: s.name }).name + ' ' + sizeLabel(s.size); }

function skuCost(sku, overrides) {
  const out = { ing: 0, env: 0, eti: 0, labor: sku.labor, total: 0 };
  for (const k in sku.recipe) {
    const ins = insById(k); if (!ins) continue;
    const unit = overrides && overrides[k] != null ? overrides[k] : ins.cost;
    const c = sku.recipe[k] * unit;
    if (ins.cat === 'envase') out.env += c; else if (ins.cat === 'etiqueta') out.eti += c; else out.ing += c;
  }
  out.total = out.ing + out.env + out.eti + out.labor;
  return out;
}
function toppingCost(t) { const tp = TOPPINGS[t]; return tp.qty * insById(tp.insumo).cost; }
function lineUnitPrice(sku, tops) { return sku.price + sum(tops || [], t => TOPPINGS[t].price); }
function lineUnitCost(sku, tops) { return skuCost(sku).total + sum(tops || [], t => toppingCost(t)); }

function recalc(o) {
  o.sub = sum(o.items, it => it.qty * it.unitPrice);
  o.disc = o.gift ? o.sub : Math.round(o.sub * (o.discountPct || 0) / 100);
  o.jarDisc = o.gift ? 0 : Math.min(o.sub - o.disc, (o.jarsBack || 0) * (o.jarRate || 0));
  o.total = o.sub - o.disc - o.jarDisc;
  if (o.subId && o.subShare != null) { o.disc = Math.max(0, o.sub - o.subShare); o.total = o.subShare; }
  o.cost = Math.round(sum(o.items, it => it.qty * it.unitCost) + (o.ship && o.shipPaidBy === 'negocio' ? o.shipCost : 0));
}
const profitOf = o => o.total - o.cost;

function paidOf(o) { return sum(S.payments.filter(p => p.orderId === o.id), p => p.amount); }
function balanceOf(o) { return o.cancelled || o.subId ? 0 : Math.max(0, o.total - paidOf(o)); }
function payState(o) {
  if (o.cancelled) return 'cancelado';
  if (o.gift) return 'regalo';
  if (o.subId) return subMonthPaid(o.subId, o.deliveryDate.slice(0, 7)) ? 'suscripcion' : 'sus-pend';
  const p = paidOf(o);
  if (p >= o.total) return 'pagado';
  return p > 0 ? 'parcial' : 'pendiente';
}

      o.subId = sb.id;

/* ---------- Stock y reservas ---------- */
function lotReserved(l) { return sum(S.reservations.filter(r => r.lotId === l.id), r => r.qty); }
function lotFree(l) { return l.qty - lotReserved(l); }
function lotState(l) {
  const D = TODAY();
  if (l.qty <= 0) return 'agotado';
  if (l.expires < D) return 'vencido';
  if (diffDays(l.expires, D) <= 3) return 'proximo';
  return 'ok';
}
function needBySku(o) { const m = {}; for (const it of o.items) m[it.skuId] = (m[it.skuId] || 0) + it.qty; return m; }
function reservedFor(oid, sku) { return sum(S.reservations.filter(r => r.orderId === oid && r.skuId === sku), r => r.qty); }
function shortage(o) {
  const m = {}; if (o.stockConsumed) return m;
  const need = needBySku(o);
  for (const k in need) { const miss = need[k] - reservedFor(o.id, k); if (miss > 0) m[k] = miss; }
  return m;
}
function fullyReserved(o) { return o.stockConsumed || Object.keys(shortage(o)).length === 0; }
function shortageText(o) { const m = shortage(o); return Object.keys(m).map(k => m[k] + ' × ' + skuShort(skuById(k))).join(', '); }
const isOpen = o => !o.cancelled && o.status !== 'entregado';

function skuStock(skuId) {
  const D = TODAY();
  const lots = S.lots.filter(l => l.skuId === skuId && l.qty > 0);
  const valid = lots.filter(l => l.expires >= D);
  const physical = sum(valid, l => l.qty);
  const reserved = sum(valid, l => lotReserved(l));
  const expired = sum(lots.filter(l => l.expires < D), l => l.qty);
  const soon = sum(valid.filter(l => diffDays(l.expires, D) <= 3), l => l.qty);
  return { physical, reserved, free: physical - reserved, expired, soon };
}

function prioritySort(a, b) {
  const pr = s => s === 'listo' ? 0 : 1;
  return pr(a.status) - pr(b.status) || a.deliveryDate.localeCompare(b.deliveryDate) || a.slot.localeCompare(b.slot) || a.number - b.number;
}

/* Reserva FEFO: primero vence, primero sale. Nunca usa lotes vencidos ni lotes que vencen antes de la entrega. */
function rebalance() {
  const D = TODAY();
  const valid = new Set(S.orders.filter(o => isOpen(o) && !o.stockConsumed).map(o => o.id));
  S.reservations = S.reservations.filter(r => {
    if (!valid.has(r.orderId)) return false;
    const l = S.lots.find(x => x.id === r.lotId);
    return l && l.expires >= D;
  });
  const open = S.orders.filter(o => valid.has(o.id)).sort(prioritySort);
  for (const o of open) {
    const need = needBySku(o);
    for (const sku in need) {
      let missing = need[sku] - reservedFor(o.id, sku);
      if (missing <= 0) continue;
      const lots = S.lots.filter(l => l.skuId === sku && l.expires >= D && l.expires >= o.deliveryDate && lotFree(l) > 0)
        .sort((a, b) => a.expires.localeCompare(b.expires) || a.made.localeCompare(b.made));
      for (const l of lots) {
        if (missing <= 0) break;
        const take = Math.min(missing, lotFree(l));
        S.reservations.push({ id: uid('r'), orderId: o.id, skuId: sku, lotId: l.id, qty: take });
        if (LOG_RES) addMove({ kind: 'producto', skuId: sku, lotId: l.id, qty: 0, resQty: take, type: 'reserva', note: 'Pedido #' + o.number + ' · lote ' + l.code });
        missing -= take;
      }
    }
  }
}
function releaseOrder(o) { S.reservations = S.reservations.filter(r => r.orderId !== o.id); }

function logOrder(o, text) { (o.log = o.log || []).push({ date: TODAY(), time: nowTime(), text }); }
function addMove(m) { S.moves.unshift(Object.assign({ id: uid('m'), date: TODAY(), time: nowTime() }, m)); }

function consumeStock(o) {
  if (o.stockConsumed) return;
  if (!fullyReserved(o)) fail('No hay stock reservado suficiente para el pedido #' + o.number + '. Faltan ' + shortageText(o) + '.');
  for (const r of S.reservations.filter(x => x.orderId === o.id)) {
    const l = S.lots.find(x => x.id === r.lotId);
    l.qty -= r.qty;
    addMove({ kind: 'producto', skuId: r.skuId, lotId: l.id, qty: -r.qty, type: 'salida', note: 'Pedido #' + o.number + ' · lote ' + l.code });
  }
  for (const it of o.items) for (const t of it.toppings || []) {
    const tp = TOPPINGS[t]; const ins = insById(tp.insumo); const q = +(tp.qty * it.qty).toFixed(3);
    ins.stock = Math.max(0, +(ins.stock - q).toFixed(3));
    addMove({ kind: 'insumo', insumoId: ins.id, qty: -q, type: 'consumo', note: 'Topping ' + tp.name.toLowerCase() + ' · pedido #' + o.number, unitCost: ins.cost });
  }
  releaseOrder(o);
  o.stockConsumed = true;
  logOrder(o, 'Salió del local: se descontó el stock');
}

function clientOrders(cid) { return S.orders.filter(o => o.clientId === cid && !o.cancelled).sort((a, b) => b.createdAt.localeCompare(a.createdAt) || b.number - a.number); }

function productionPlan() {
  return S.skus.map(sku => {
    const open = S.orders.filter(o => isOpen(o) && !o.stockConsumed);
    const confirmed = sum(open, o => needBySku(o)[sku.id] || 0);
    const reserved = sum(open, o => reservedFor(o.id, sku.id));
    const missing = confirmed - reserved;
    const st = skuStock(sku.id);
    const scheduled = sum(S.prodOrders.filter(p => p.skuId === sku.id && (p.status === 'programada' || p.status === 'en_curso')), p => p.qty);
    const forOrders = Math.max(0, missing - scheduled);
    const coverAfter = Math.max(0, scheduled - missing);
    const forStock = Math.max(0, sku.min - st.free - coverAfter);
    return { sku, confirmed, reserved, missing, free: st.free, scheduled, forOrders, forStock, need: forOrders + forStock };
  });
}

    const o = orderById(id);
    if (o.stockConsumed || o.status === 'entregado') fail('El pedido #' + o.number + ' ya salió del local: no se puede cancelar.');
    for (const r of S.reservations.filter(x => x.orderId === o.id)) addMove({ kind: 'producto', skuId: r.skuId, lotId: r.lotId, qty: 0, resQty: -r.qty, type: 'libera', note: 'Pedido #' + o.number + ' cancelado' });
    releaseOrder(o);
    o.cancelled = true;
    logOrder(o, 'Pedido cancelado');
    rebalance();
    const p = paidOf(o);
    return 'Pedido #' + o.number + ' cancelado' + (p > 0 ? '. Tenía ' + money(p) + ' cobrados: registrá la devolución por fuera.' : '');
  },

  saveOrder(d, editId) {
    const o = editId ? orderById(editId) : null;
    if (o && o.stockConsumed) fail('Este pedido ya salió del local y no se puede editar.');
    const isNew = d.clientId === 'new';
    if (isNew) {
      const name = (d.newName || '').trim();
      if (name.length < 2) fail('Escribí el nombre del cliente nuevo.');
      if (S.clients.some(c => c.name.toLowerCase() === name.toLowerCase())) fail('Ya existe un cliente con ese nombre: elegilo de la lista.');
    } else if (!clientById(d.clientId)) fail('Elegí un cliente.');
    if (!d.items.length) fail('Agregá al menos un producto.');
    if (d.items.some(it => !(it.qty >= 1))) fail('Revisá las cantidades.');
    if (!d.date) fail('Elegí la fecha de entrega.');
    if (!o && d.date < TODAY()) fail('La fecha de entrega no puede ser anterior a hoy.');
    if (!d.slot) fail('Elegí la franja horaria.');
    if (d.delivery !== 'retiro' && !(d.address || '').trim()) fail('Falta la dirección de entrega.');
    const shipCost = Math.round(+d.shipCost || 0);
    if (shipCost < 0) fail('El costo de envío no puede ser negativo.');
    const disc = Math.round(+d.discountPct || 0);
    if (disc < 0 || disc > 50) fail('El descuento tiene que estar entre 0% y 50%.');
    const deposit = Math.round(+d.deposit || 0);
    if (deposit < 0) fail('La seña no puede ser negativa.');
    const fields = {
      deliveryDate: d.date, slot: d.slot, channel: d.channel, delivery: d.delivery, payMethod: d.payMethod,
      items: d.items.map(it => [it.skuId, Math.round(it.qty), it.toppings]), discountPct: disc, notes: (d.notes || '').trim(),
      shipCost: d.delivery === 'retiro' ? 0 : shipCost, shipPaidBy: d.shipPaidBy, address: (d.address || '').trim(), ref: (d.ref || '').trim(),
      gift: !!d.gift, jarsBack: d.gift ? 0 : Math.max(0, Math.round(+d.jarsBack || 0)), jarRate: jarRate(),
    };
    if (d.gift && Math.round(+d.deposit || 0) > 0) fail('Un regalo no lleva seña.');
    if (o) {
      const keep = { number: o.number, clientId: o.clientId, createdAt: o.createdAt, createdTime: o.createdTime, status: o.status, log: o.log, ship: o.delivery === d.delivery ? o.ship : null, subId: o.subId, subShare: o.subShare };
      if (!isNew) keep.clientId = d.clientId;
      const n = mkOrder(Object.assign({}, fields, keep));
      const paid = paidOf(o);
      if (paid > n.total) fail('El nuevo total (' + money(n.total) + ') es menor a lo ya cobrado (' + money(paid) + ').');
      if (isNew) n.clientId = A.addClient({ name: d.newName, phone: d.newPhone, address: d.address, barrio: d.barrio, ref: d.ref, channel: d.channel, delivery: d.delivery });
      releaseOrder(o);
      const wasReady = n.status === 'listo';
      if (wasReady) n.status = 'por_elaborar';
      Object.assign(o, n);
      logOrder(o, 'Pedido editado');
      rebalance();
      if (wasReady && fullyReserved(o)) o.status = 'listo';
      return { msg: 'Cambios guardados en el pedido #' + o.number + (wasReady && o.status !== 'listo' ? '. Volvió a "Por elaborar" porque falta stock.' : ''), id: o.id };
    }
    const preview = mkOrder(Object.assign({}, fields, { number: 0, clientId: 'x', status: 'por_elaborar' }));
    if (deposit > preview.total) fail('La seña supera el total del pedido.');
    const cid = isNew ? A.addClient({ name: d.newName, phone: d.newPhone, address: d.address, barrio: d.barrio, ref: d.ref, channel: d.channel, delivery: d.delivery }) : d.clientId;
    const c = clientById(cid);
    if (d.delivery !== 'retiro' && !c.address) { c.address = fields.address; c.ref = fields.ref; }
    const n = mkOrder(Object.assign({}, fields, { number: S.seq.order++, clientId: cid, status: 'por_elaborar', createdAt: TODAY(), createdTime: nowTime() }));
    n.log = [{ date: TODAY(), time: nowTime(), text: 'Pedido tomado por ' + CHANNELS[n.channel] }];
    S.orders.push(n);
    rebalance();
    if (deposit > 0) A.addPayment(n.id, deposit, d.payMethod, 'Seña al tomar el pedido');
    const miss = shortageText(n);
    return { msg: 'Pedido #' + n.number + ' creado' + (miss ? '. Falta producir: ' + miss : '. Todo el stock quedó reservado'), id: n.id };
  },

  addClient(d) {
    const name = (d.name || '').trim();
    if (name.length < 2) fail('El nombre es obligatorio.');
    if (S.clients.some(c => c.name.toLowerCase() === name.toLowerCase())) fail('Ya existe un cliente con ese nombre.');
    const c = { id: uid('c'), name, phone: (d.phone || '').trim(), address: (d.address || '').trim(), barrio: (d.barrio || '').trim(), ref: (d.ref || '').trim(), channel: d.channel || 'whatsapp', delivery: d.delivery || 'uber', favs: [], every: null, biz: false };
    S.clients.push(c);
    return c.id;
  },

  addPayment(id, amount, method, note) {
    const o = orderById(id);
    if (o.cancelled) fail('El pedido está cancelado: no se pueden registrar cobros.');
    const paid = paidOf(o), bal = o.total - paid;
    amount = Math.round(+amount);
    if (bal <= 0) fail('El pedido #' + o.number + ' ya está cobrado completo.');
    if (!(amount > 0)) fail('Ingresá un importe mayor a cero.');
    if (amount > bal) fail('El importe supera el saldo pendiente (' + money(bal) + ').');
    const kind = amount === bal ? (paid === 0 ? 'Pago total' : 'Cancela saldo') : (paid === 0 && o.status !== 'entregado' ? 'Seña' : 'Pago parcial');
    S.payments.push({ id: uid('p'), orderId: o.id, amount, method, date: TODAY(), time: nowTime(), kind, note: note || '' });
    logOrder(o, kind + ' de ' + money(amount) + ' (' + method + ')');
    return amount === bal ? 'Pedido #' + o.number + ' cobrado completo' : 'Cobro registrado. Saldo: ' + money(bal - amount);
  },

  shipAssign(id, driver, ref, cost) {
    const o = orderById(id);
    if (!o.ship) fail('Este pedido se retira en el local.');
    if (o.ship.status === 'en_camino' || o.ship.status === 'entregado') fail('El conductor ya retiró este pedido.');
    if (o.status !== 'listo') fail('Primero marcá el pedido #' + o.number + ' como "Listo para enviar".');
    if (!(driver || '').trim()) fail('Escribí el nombre del conductor.');
    o.ship.driver = driver.trim(); o.ship.tripRef = (ref || '').trim(); o.ship.status = 'solicitado'; o.ship.requestedAt = nowTime();
    if (cost !== '' && cost != null && +cost >= 0) { o.shipCost = Math.round(+cost); recalc(o); }
    logOrder(o, 'Envío solicitado: ' + o.ship.driver + (o.ship.tripRef ? ' · ' + o.ship.tripRef : ''));
    return 'Conductor registrado para #' + o.number;
  },
  shipPickup(id) {
    const o = orderById(id);
    if (!o.ship || o.ship.status !== 'solicitado') fail('Registrá primero el conductor.');
    consumeStock(o);
    o.ship.status = 'en_camino'; o.ship.pickedAt = nowTime();
    logOrder(o, 'El conductor retiró el pedido');
    return 'Pedido #' + o.number + ' en camino';
  },
  shipDeliver(id) {
    const o = orderById(id);
    if (!o.ship || o.ship.status !== 'en_camino') fail('Solo se puede marcar entregado un pedido que ya retiró el conductor.');
    A.moveOrder(id, 'entregado');
    const bal = balanceOf(o);
    return 'Pedido #' + o.number + ' entregado' + (bal > 0 ? '. Queda por cobrar ' + money(bal) : '');
  },
  shipIncident(id, type, note) {
    const o = orderById(id);
    if (!o.ship) fail('Este pedido no tiene envío.');
    o.ship.incident = { type, note: (note || '').trim(), date: TODAY(), time: nowTime() };
    o.ship.incidents = (o.ship.incidents || []).concat([o.ship.incident]);
    logOrder(o, 'Incidencia: ' + type + (note ? ' — ' + note : ''));
    return 'Incidencia registrada en #' + o.number;
  },
  shipResolve(id, retry) {
    const o = orderById(id);
    if (!o.ship || !o.ship.incident) return null;
    o.ship.incident = null;
    if (retry && o.ship.status !== 'entregado') { o.ship.status = 'pendiente'; o.ship.driver = ''; o.ship.tripRef = ''; logOrder(o, 'Envío reprogramado'); return 'Envío de #' + o.number + ' listo para volver a solicitar'; }
    logOrder(o, 'Incidencia resuelta');
    return 'Incidencia resuelta';
  },

  createPO(skuId, qty, date, note) {
    qty = Math.round(+qty);
    if (!skuById(skuId)) fail('Elegí un producto.');
    if (!(qty > 0)) fail('La cantidad tiene que ser mayor a cero.');
    if (!date) fail('Elegí la fecha.');
    const po = { id: 'po' + S.seq.po++, skuId, qty, date, status: 'programada', stage: 0, lotId: null, note: (note || '').trim() };
    S.prodOrders.push(po);
    return 'Orden ' + po.id.toUpperCase() + ' creada: ' + qty + ' × ' + skuShort(skuById(skuId));
  },
  startPO(id) {
    const po = S.prodOrders.find(p => p.id === id);
    if (po.status !== 'programada') fail('Esta orden ya está en curso o cerrada.');
    po.status = 'en_curso'; po.stage = 0; po.startedAt = nowTime();
    let moved = 0;
    for (const o of S.orders) if (isOpen(o) && o.status === 'por_elaborar' && shortage(o)[po.skuId]) { o.status = 'en_produccion'; logOrder(o, 'Pasó a en producción'); moved++; }
    return 'Producción iniciada' + (moved ? '. ' + moved + (moved === 1 ? ' pedido pasó' : ' pedidos pasaron') + ' a "En producción"' : '');
  },
  advancePO(id) {
    const po = S.prodOrders.find(p => p.id === id);
    if (po.status !== 'en_curso') fail('La orden no está en curso.');
    if (po.stage >= STAGES.length - 1) fail('Ya está en la última etapa: finalizala.');
    po.stage++;
    return STAGES[po.stage];
  },
  finishPO(id, realQty) {
    const po = S.prodOrders.find(p => p.id === id);
    if (!po || (po.status !== 'programada' && po.status !== 'en_curso')) fail('Esta orden ya fue finalizada o cancelada.');
    const sku = skuById(po.skuId);
    const q = Math.round(+realQty);
    if (!(q > 0)) fail('Indicá cuántas unidades salieron.');
    if (!(sku.shelf > 0)) fail('Configurá la vida útil de ' + sku.name + ' en Recetas antes de generar el lote.');
    const lacks = [];
    for (const k in sku.recipe) { const ins = insById(k); const need = sku.recipe[k] * q; if (ins.stock + 1e-9 < need) lacks.push(ins.name + ' (faltan ' + fmtN(need - ins.stock) + ' ' + ins.unit + ')'); }
    if (lacks.length) fail('No alcanzan los insumos: ' + lacks.join(', ') + '. Registrá una compra en Inventario.');
    const D = TODAY();
    const lot = { id: uid('l'), code: lotCode(sku, D), skuId: sku.id, made: D, expires: addDays(D, sku.shelf), qty: q, initial: q };
    S.lots.push(lot);
    for (const k in sku.recipe) {
      const ins = insById(k); const need = +(sku.recipe[k] * q).toFixed(3);
      ins.stock = +(ins.stock - need).toFixed(3);
      addMove({ kind: 'insumo', insumoId: k, qty: -need, type: 'consumo', unitCost: ins.cost, note: 'Producción lote ' + lot.code });
    }
    addMove({ kind: 'producto', skuId: sku.id, lotId: lot.id, qty: q, type: 'produccion', note: 'Orden ' + po.id.toUpperCase() + ' · lote ' + lot.code });
    po.status = 'finalizada'; po.stage = STAGES.length - 1; po.lotId = lot.id; po.realQty = q; po.finishedAt = nowTime();
    rebalance();
    const res = lotReserved(lot);
    return 'Lote ' + lot.code + ' creado con ' + q + ' unidades (vence ' + fmtDate(lot.expires) + ').' + (res ? ' Se reservaron ' + res + ' para pedidos.' : '');
  },
  cancelPO(id) {
    const po = S.prodOrders.find(p => p.id === id);
    if (po.status === 'finalizada') fail('Una orden finalizada no se puede cancelar.');
    po.status = 'cancelada';
    return 'Orden ' + po.id.toUpperCase() + ' cancelada';
  },

  buyInsumo(id, qty, cost, supplier) {
    const ins = insById(id); qty = +qty; cost = Math.round(+cost);
    if (!(qty > 0)) fail('La cantidad tiene que ser mayor a cero.');
    if (!(cost > 0)) fail('Ingresá el costo por ' + ins.unit + '.');
    ins.stock = +(ins.stock + qty).toFixed(3);
    const old = ins.cost; ins.cost = cost;
    addMove({ kind: 'insumo', insumoId: id, qty, type: 'compra', unitCost: cost, note: 'Compra' + (supplier ? ' a ' + supplier.trim() : '') + (old !== cost ? ' · costo ' + money(old) + ' → ' + money(cost) : '') });
    return 'Compra registrada: ' + fmtN(qty) + ' ' + ins.unit + ' de ' + ins.name.toLowerCase();
  },
  wasteInsumo(id, qty, reason) {
    const ins = insById(id); qty = +qty;
    if (!(qty > 0)) fail('La cantidad tiene que ser mayor a cero.');
    if (qty > ins.stock) fail('No podés desperdiciar más de lo que hay (' + fmtN(ins.stock) + ' ' + ins.unit + ').');
    ins.stock = +(ins.stock - qty).toFixed(3);
    addMove({ kind: 'insumo', insumoId: id, qty: -qty, type: 'desperdicio', unitCost: ins.cost, note: reason || 'Desperdicio' });
    return 'Desperdicio registrado';
  },
  setInsumoMin(id, min) { const ins = insById(id); min = +min; if (!(min >= 0)) fail('El mínimo no puede ser negativo.'); ins.min = min; return 'Stock mínimo actualizado'; },
  setInsumoCost(id, cost) {
    const ins = insById(id); cost = Math.round(+cost); if (!(cost > 0)) fail('El costo tiene que ser mayor a cero.');
    const old = ins.cost; ins.cost = cost;
    addMove({ kind: 'insumo', insumoId: id, qty: 0, type: 'ajuste', unitCost: cost, note: 'Costo actualizado ' + money(old) + ' → ' + money(cost) });
    return 'Nuevo costo de ' + ins.name.toLowerCase() + ': ' + money(cost) + ' por ' + ins.unit;
  },
  writeOffLot(id, qty, reason) {
    const l = S.lots.find(x => x.id === id); qty = Math.round(+qty);
    const free = l.expires < TODAY() ? l.qty : lotFree(l);
    if (!(qty > 0)) fail('Indicá cuántas unidades das de baja.');
    if (qty > free) fail('Solo podés dar de baja unidades sin reservar (' + free + ').');
    l.qty -= qty;
    addMove({ kind: 'producto', skuId: l.skuId, lotId: l.id, qty: -qty, type: 'baja', note: (reason || 'Baja') + ' · lote ' + l.code + ' · ' + money(qty * skuCost(skuById(l.skuId)).total) + ' a costo' });
    rebalance();
    return qty + ' unidades dadas de baja del lote ' + l.code;
  },
  updateSku(id, f) {
    const s = skuById(id);
    const price = Math.round(+f.price), labor = Math.round(+f.labor), shelf = Math.round(+f.shelf), min = Math.round(+f.min);
    if (!(price > 0)) fail('El precio tiene que ser mayor a cero.');
    if (!(labor >= 0)) fail('El costo de elaboración no puede ser negativo.');
    if (!(shelf >= 1 && shelf <= 60)) fail('La vida útil tiene que estar entre 1 y 60 días.');
    if (!(min >= 0)) fail('El stock mínimo no puede ser negativo.');
    const recipe = {};
    for (const k in f.recipe) { const v = +f.recipe[k]; if (v < 0 || isNaN(v)) fail('Revisá las cantidades de la receta.'); if (v > 0) recipe[k] = v; }
    Object.assign(s, { price, labor, shelf, min, recipe });
    return 'Receta de ' + s.name + ' actualizada';
  },
  importClients(rows) {
    let n = 0;
    for (const r of rows) { A.addClient({ name: r.nombre, phone: r.telefono, address: r.direccion, barrio: r.barrio, ref: r.referencia, channel: r.canal || 'whatsapp', delivery: r.direccion ? 'uber' : 'retiro' }); n++; }
    S.onboard.clients = true;
    return n + (n === 1 ? ' cliente importado' : ' clientes importados');
  },
  importProducts(rows) {
    let nNew = 0, nUpd = 0;
    for (const r of rows) {
      if (r._update) { const s = skuById(r._update); s.price = r.precio; nUpd++; continue; }
      const fk = 'f_' + uid(''), base = r.producto.replace(/^yogur(t)?\s+(griego\s+)?(de\s+|con\s+)?/i, '').replace(/\s*\d+(\s*(g|gr|kg|ml))\b.*$/i, '').trim() || r.producto;
      S.flavors[fk] = { name: cap(base), top: '#C9A74A' }; FLAVORS[fk] = S.flavors[fk];
      const id = uid('sku');
      S.skus.push({ id, code: (base.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'PRD') + r.tamano, flavor: fk, size: r.tamano, price: r.precio, labor: 0, shelf: r.vida, min: 0, recipe: {}, name: r.producto, imported: true });
      nNew++;
    }
    S.onboard.products = true;
    return [nNew ? nNew + (nNew === 1 ? ' producto nuevo' : ' productos nuevos') : '', nUpd ? nUpd + (nUpd === 1 ? ' precio actualizado' : ' precios actualizados') : ''].filter(Boolean).join(' y ') || 'Nada para importar';
  },
  importStock(rows) {
    let n = 0, u = 0;
    for (const r of rows) {
      const sku = skuById(r._sku);
      const lot = { id: uid('l'), code: lotCode(sku, r.elaboracion), skuId: sku.id, made: r.elaboracion, expires: r.vencimiento, qty: r.cantidad, initial: r.cantidad };
      S.lots.push(lot);
      addMove({ kind: 'producto', skuId: sku.id, lotId: lot.id, qty: r.cantidad, type: 'produccion', note: 'Stock inicial importado · lote ' + lot.code });
      n++; u += r.cantidad;
    }
    rebalance();
    S.onboard.stock = true;
    return u + ' unidades cargadas en ' + n + (n === 1 ? ' lote' : ' lotes');
  },
  saveSub(d, id) {
    const c = clientById(d.clientId);
    if (!c) fail('Elegí la clienta o el cliente.');
    const items = (d.items || []).filter(it => it.qty > 0);
    if (!items.length) fail('Agregá al menos un producto a la suscripción.');
    const price = Math.round(+d.price);
    if (!(price > 0)) fail('Poné el precio mensual.');
    if (d.delivery !== 'retiro' && !c.address) fail('El cliente no tiene dirección cargada para los envíos.');
    if (id) {
      const sb = subById(id);
      Object.assign(sb, { items, weekday: +d.weekday, slot: d.slot, delivery: d.delivery, price });
      for (const o of S.orders.filter(o => o.subId === id && o.status === 'por_elaborar' && !o.stockConsumed && o.deliveryDate >= TODAY())) { releaseOrder(o); o.cancelled = true; logOrder(o, 'Reemplazado por cambios en la suscripción'); }
      ensureSubOrders(); rebalance();
      return 'Suscripción actualizada. Los próximos envíos ya tienen los cambios.';
    }
    if ((S.subs || []).some(x => x.clientId === c.id && x.active)) fail('Este cliente ya tiene una suscripción activa.');
    S.subs = S.subs || [];
    S.subs.push({ id: uid('sub'), clientId: c.id, items, weekday: +d.weekday, slot: d.slot, delivery: d.delivery, price, start: TODAY(), active: true });
    ensureSubOrders(); rebalance();
    return 'Suscripción creada para ' + c.name + '. Ya se programaron los envíos de las próximas 2 semanas.';
  },
  pauseSub(id) {
    const sb = subById(id); sb.active = !sb.active;
    if (!sb.active) for (const o of S.orders.filter(o => o.subId === id && o.status === 'por_elaborar' && !o.stockConsumed && o.deliveryDate >= TODAY())) { releaseOrder(o); o.cancelled = true; logOrder(o, 'Suscripción pausada'); }
    else ensureSubOrders();
    rebalance();
    return sb.active ? 'Suscripción reactivada' : 'Suscripción pausada. Se cancelaron los envíos que no estaban en preparación.';
  },
  paySub(id, month, method) {
    const sb = subById(id);
    if (subMonthPaid(id, month)) fail('Ese mes ya está pagado.');
    S.payments.push({ id: uid('p'), orderId: null, subId: id, month, amount: sb.price, method, date: TODAY(), time: nowTime(), kind: 'Suscripción' });
    return 'Pago de la suscripción registrado: ' + money(sb.price);
  },
  addEvent(name, date) {
    if (!(name || '').trim()) fail('Poné un nombre a la fecha.');
    if (!date) fail('Elegí la fecha.');
    S.events.push({ id: uid('e'), name: name.trim(), date });
    return 'Fecha agregada al calendario';
  },
};

function statusChip(o) {

function delta(cur, prev, label) {
  if (!prev) return `<span class="delta flat">sin datos ${label || ''}</span>`;
  const r = (cur - prev) / prev;
